id: final-review
phase: implement
order: 10
description: Run parallel comprehensive review at staff engineer bar, score, and iterate until >= 9/10

review_scenarios:
  full_stack:
    label: "Scenario A: Full-Stack (UI + Backend)"
    applies_when: feature touches both UI components/pages and API routes/data/server logic
    reviews:
      - name: Code Quality
        tool: pr-review-toolkit:code-reviewer
        dispatch: agent
      - name: Silent Failures
        tool: pr-review-toolkit:silent-failure-hunter
        dispatch: agent
      - name: Type Design
        tool: pr-review-toolkit:type-design-analyzer
        dispatch: agent
      - name: Security Audit
        tool: mcp__pal__secaudit
      - name: Cross-Model Review
        skill: phase-review
      - name: UX Critique
        skill: /critique
      - name: Frontend Design
        skill: frontend-design:frontend-design
      - name: Runtime Verification
        method: live server — API curl + Chrome DevTools interaction

  ui_only:
    label: "Scenario B: UI Only (no new API/backend logic)"
    applies_when: feature touches only components, pages, or styling — no new API or backend logic
    reviews:
      - name: Code Quality
        tool: pr-review-toolkit:code-reviewer
        dispatch: agent
      - name: Silent Failures
        tool: pr-review-toolkit:silent-failure-hunter
        dispatch: agent
      - name: Cross-Model Review
        skill: phase-review
      - name: UX Critique
        skill: /critique
      - name: Frontend Design
        skill: frontend-design:frontend-design
      - name: Runtime Verification
        method: live server — Chrome DevTools navigation and interaction

  backend_only:
    label: "Scenario C: Backend Only (APIs, data, infra)"
    applies_when: feature touches only API routes, data layer, infra, or server logic — no UI changes
    reviews:
      - name: Code Quality
        tool: pr-review-toolkit:code-reviewer
        dispatch: agent
      - name: Silent Failures
        tool: pr-review-toolkit:silent-failure-hunter
        dispatch: agent
      - name: Type Design
        tool: pr-review-toolkit:type-design-analyzer
        dispatch: agent
      - name: Security Audit
        tool: mcp__pal__secaudit
      - name: Cross-Model Review
        skill: phase-review

  bugfix:
    label: "Scenario D: Bugfix"
    applies_when: schema is bugfix
    reviews:
      - name: Code Quality
        tool: pr-review-toolkit:code-reviewer
        dispatch: agent
      - name: Silent Failures
        tool: pr-review-toolkit:silent-failure-hunter
        dispatch: agent
      - name: Cross-Model Review
        skill: phase-review
      - name: Security Audit
        tool: mcp__pal__secaudit

additional_reviews:
  - condition: schema == feature-tdd
    name: Test Coverage
    tool: pr-review-toolkit:pr-test-analyzer
    dispatch: agent
  - condition: feature touches config or tooling changes
    name: Type Design
    tool: pr-review-toolkit:type-design-analyzer
    dispatch: agent

scoring:
  scale: 1-10
  aggregate: single score across all reviewers
  severity_caps:
    critical: caps aggregate score at 5
    important: caps aggregate score at 7
  pass_threshold: 9

feedback_loop:
  max_iterations: 2
  finding_categories:
    critical: must fix
    important: should fix
    advisory: nice to have
  on_critical_or_important:
    - create tasks via TaskCreate with metadata.phase = "Review Fixes"
    - implement through task loop (step 05-execute-tasks)
    - re-run /simplify on changed files
    - re-verify: type-check, tests, build
    - re-run only the reviews that had critical/important findings
    - re-score
  on_cap_exceeded: escalate to user via AskUserQuestion

parallel_fix_dispatch:
  rule: when multiple reviewers flag issues, dispatch parallel subagents simultaneously
  per_subagent: one reviewer's findings + relevant files
  after_all_complete: re-verify holistically before re-running reviews

instruction: |
  ## Final Comprehensive Review (Staff Engineer Bar)

  Run the review suite for the matching scenario. All reviews dispatch in parallel.

  ### Select Scenario

  Read spec and git diff to determine which applies:
  - **Full-Stack**: UI + backend → all 8 reviews
  - **UI Only**: no new API/backend → 6 reviews
  - **Backend Only**: no UI → 5 reviews
  - **Bugfix**: schema is bugfix → 4 reviews

  When in doubt, choose Full-Stack (superset).

  Additional reviews (add to any scenario):
  - feature-tdd schema → add `pr-test-analyzer`
  - Config/tsconfig/build changes → add `type-design-analyzer`

  ### Score

  Single aggregate score 1-10 per `scoring` config above.
  - Critical findings → cap at 5
  - Important findings → cap at 7
  - Score >= 9 requires zero critical/important findings

  ### Score >= 9: Proceed

  Compile Final Review Report (aggregate score, per-reviewer findings, advisory items).

  ### Score < 9: Feedback Loop

  1. Categorize findings: critical (must fix), important (should fix), advisory (non-blocking)
  2. Create tasks for critical/important findings via TaskCreate (phase: "Review Fixes")
  3. Parallel fix dispatch: one subagent per reviewer's findings when multiple reviewers flag issues
  4. After fixes: re-simplify, re-verify (type-check, tests, build), re-run failed reviews, re-score
  5. Max 2 iterations. Counts toward global loop-back cap (max 3 total).
  6. Still < 9 after 2 iterations → escalate to user via AskUserQuestion
