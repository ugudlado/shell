id: start-dev-server
phase: implement
order: 4
description: Start the project dev server once and keep it running for the entire implementation session

server_lifecycle:
  start: once per session — before first task, not between tasks or phases
  stop: after `signoff-gate` passes or escalation
  restart_allowed: false   # HMR/watch mode picks up code changes automatically
  ready_check:
    method: curl
    timeout_seconds: 15
    retry: true

hooks:
  register: dev-server-register PostToolUse hook (auto-registers PID)
  guard: process-kill-guard PreToolUse hook (only the registered PID can be killed)

pid_location: /tmp/claude-dev-servers/*.pid

instruction: |
  ## Read the Project Dev Command

  Read the project's CLAUDE.md to find:
  - The correct dev command (e.g., `pnpm dev`, `npm run dev`, `cargo watch`, etc.)
  - The dev server port
  - Any required setup steps before starting

  ## Start the Dev Server

  From the worktree root:
  ```bash
  cd "$WORKTREE"
  <dev-command> &
  ```

  Start it in the background. The `dev-server-register` PostToolUse hook will automatically record the PID.

  ## Wait for Ready

  After starting, retry `curl` against the project's dev URL until the server responds or 15 seconds elapse:
  ```bash
  for i in $(seq 1 15); do
    curl -sf http://localhost:<PORT>/ > /dev/null 2>&1 && break
    sleep 1
  done
  ```

  Do not proceed with task execution until the server is confirmed ready.

  ## Handle Startup Failures

  If the server fails to respond within 15 seconds:
  1. Check for stale processes occupying the dev port:
     ```bash
     lsof -ti:<PORT>
     ```
  2. Kill any stale registered PIDs (allowed by the process-kill-guard since they were registered by a prior session):
     ```bash
     PID_FILE=$(ls /tmp/claude-dev-servers/*.pid 2>/dev/null | head -1)
     [ -f "$PID_FILE" ] && kill $(head -1 "$PID_FILE") && rm "$PID_FILE"
     ```
  3. Retry the dev server start once.
  4. If still failing after one retry, escalate to the user — do not proceed with implementation.

  ## Keep Alive for the Full Session

  The server stays running through ALL tasks and phases. Do NOT restart between tasks.
  Watch mode / HMR picks up code changes automatically — no restart is needed.
