id: simplify
phase: implement
order: 7
description: Simplify the current task's code before review — catches complexity while context is fresh

skill: simplify

instruction: |
  ## Context

  For each task in `state.yaml.current_tasks` where step == "simplify":
  - Files modified by the implementer (from state's implementer_output)
  - Task details (from TaskGet)

  ## Invoke /simplify

  Run the `/simplify` skill scoped to ONLY the files modified by the implementer
  for this task. Do not simplify unrelated files.

  The simplify skill will reduce complexity, eliminate dead code, flatten
  unnecessary abstractions, and improve readability without changing behavior.

  ## Re-Verify After Simplification

  If simplification made changes, run a quick verification:

  ```bash
  pnpm type-check
  ```

  If type-check fails, the simplification introduced a regression — revert the
  problematic simplification and proceed. Use `systematic-debugging` if the
  cause is not obvious.

  ## State Update

  Advance step to `review`:
  ```yaml
  current_tasks:
    - task_id: "T-1"
      step: review      # was: simplify
      iteration: 1
      simplified: true   # flag for reviewer context
  ```

  If simplification was skipped (no changes needed), still advance to review:
  ```yaml
  current_tasks:
    - task_id: "T-1"
      step: review
      iteration: 1
      simplified: false
  ```
