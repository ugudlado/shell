id: auto-resume
phase: implement
order: 2
description: Detect prior session state from state.yaml, TaskList, and git status, then resume from the correct step

resume_rules:
  - state: task_in_progress
    condition: state.yaml has current_tasks with entries, or a task has status "in_progress"
    action: Resume at the task's recorded step (implement/review/verify) from state.yaml
  - state: phase_complete_uncommitted
    condition: All tasks in a phase are "completed" but the phase has not been committed
    action: Jump to phase-verify
  - state: mid_task_crash
    condition: Uncommitted changes exist AND a task is "in_progress"
    action: Continue implementing that task with existing changes
  - state: all_tasks_done_committed
    condition: All tasks "completed" AND all phases committed
    action: Jump to final-validation
  - state: final_review_done
    condition: All tasks completed AND final review already completed
    action: Jump to architect-signoff

prompt_user_if:
  - Orphaned changes (uncommitted but no task in_progress)
  - Merge conflicts on in_progress task files

always_after_resume:
  - Start dev server (step 04) always runs after this step

instruction: |
  ## Detect Prior Session State

  Read state in this order:
  1. `state.yaml` — check `current_tasks` array for in-progress work with step info
  2. `TaskList` — capture all task statuses
  3. `git status` — check for uncommitted changes

  ## Match a Resume Rule

  Evaluate rules in order. Apply the FIRST match:

  1. **state.yaml has current_tasks**: Resume at the exact step recorded for each task.
     If task was at step `review`, jump to review. If `verify`, jump to verify.
     If `implement` with iteration > 1, it's a retry — carry forward feedback from state.
     Log: "Resuming: T-N at [step], iteration [N]"

  2. **task_in_progress (no state.yaml)**: A task is in_progress but state.yaml is missing.
     Reconstruct: set step to `implement`, iteration 1. Log and proceed to pick-task.

  3. **phase_complete_uncommitted**: All tasks in a phase completed but no phase commit.
     Jump to phase-verify.

  4. **all_tasks_done_committed**: All done and committed. Jump to final-validation.

  5. **final_review_done**: Final review present. Jump to architect-signoff.

  ## Prompt User Only When Necessary

  - Orphaned changes (uncommitted, no task in_progress) → ask continue or discard
  - Merge conflicts on in_progress task files → present and ask for direction

  ## Log Resume Decision

  Output: `"Resuming: [state] → [action]"`. Example: `"Resuming: T-2 at review, iteration 2"`

  ## Always Start Dev Server

  After resume, proceed to start-dev-server. Prior session's process is dead.
