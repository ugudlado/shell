id: report
phase: complete
order: 8
description: Output the final completion report with metrics to the user

# Structured config
executor: main-session
format: markdown summary block
metrics_source: telemetry from step 04-retrospective

report_fields:
  - feature_id
  - merge_status: "Merged to main, worktree cleaned up"
  - linear_status: "Linear ticket closed"
  - memory_status: "Learnings stored in memory"
  - tasks_planned: N
  - tasks_unplanned: N
  - unplanned_ratio: X%
  - spec_hit_rate: X%
  - surprise_files: N
  - review_iterations: N
  - signoff_rounds: N
  - top_unplanned_source: category name

instruction: |
  Output the final completion report to the user. Pull values from the telemetry
  written in step 04-retrospective.

  ```
  Feature Complete: [FEATURE_ID]
  - Merged to main, worktree cleaned up
  - Linear ticket closed
  - Learnings stored in memory

  Metrics:
  - Tasks: N planned, N unplanned (ratio: X%)
  - Spec accuracy: X% hit rate, N surprise files
  - Review iterations: N, Signoff rounds: N
  - Top unplanned source: [category]
  ```
