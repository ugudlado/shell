id: design
phase: specify
order: 6
description: Architect produces spec and design artifacts from the approved Discovery Brief

agent: architect
produces:
  feature-tdd: [spec.md, design.md]
  feature-rapid: [spec.md, design.md]
  bugfix: [diagnosis.md, fix-plan.md]
deferred: tasks.md   # tasks generated by /implement, not here

instruction: |
  ## Context

  - FEATURE_DESC and SCHEMA from `parse-args`
  - Memory search results from `search-memory`
  - The full approved Discovery Brief from `discovery-gate`
  - Mode: "Specification — produce spec.md and design.md. Do NOT generate tasks.md."

  ## Expected Outcomes

  1. **Artifacts** — spec.md and design.md content, ready to write to disk
  2. **Pushback** — Architect disagrees with the chosen approach. Relay to user via
     AskUserQuestion. User decides. Re-engage with the decision.
  3. **Research request** — needs data the Discovery Brief didn't cover. Perform targeted
     research and send back via SendMessage. Should be rare.
