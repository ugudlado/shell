id: discovery
phase: specify
order: 4
description: Phase 0 Discovery — brainstorm intent, explore alternatives, challenge assumptions before committing to an approach

skip_when: schema == "bugfix"

agent: discoverer

ui_detection_signals:
  direct:
    - UI
    - frontend
    - page
    - component
    - dashboard
    - form
    - widget
    - modal
    - sidebar
    - panel
    - layout
    - navigation
    - menu
    - button
    - input
    - table
    - chart
    - graph
  indirect:
    - "user sees"
    - display
    - show
    - render
    - visual
    - screen
    - view
    - interface

skills:
  - playground   # invoked when UI is detected

playground:
  max_feedback_rounds: 3

discovery_brief:
  min_use_cases: 3
  min_happy_path: 2
  min_error_edge: 1
  use_case_format: "UC-N: [title] — [actor] wants to [action] so that [outcome]"
  error_case_format: "UC-EN: [title] — what happens when [condition]"

instruction: |
  ## Skip Condition

  If SCHEMA == "bugfix", skip this step and `discovery-gate`. Bugfixes use diagnosis.md
  for investigation, not discovery. Jump to `design`.

  ## Step 4a. Discoverer Context

  Provide:
  - FEATURE_DESC and SCHEMA from `parse-args`
  - Memory search results from `search-memory`

  Returns a structured Discovery Brief: intent, what already exists (codebase + external
  with evidence), build-or-reuse decision, 2-3 approaches, use cases, scope, technical
  context, and open questions.

  ## Step 4b. UI Detection and Playground

  After receiving the Discoverer's output, scan FEATURE_DESC (case-insensitive) for UI signals
  listed in the config above.

  **If UI is detected:**

  1. Inform the user: "This feature involves UI. Creating an interactive playground for visual
     direction before we proceed with spec/design."
  2. Invoke the `/playground` skill. Pass the use cases from the Discovery Brief as context.
  3. Use `AskUserQuestion` to present the playground and ask:
     "Review the playground above. Does this visual direction work? Adjust as needed."
  4. Iterate on feedback — maximum 3 rounds.
  5. Capture approved UI direction for the Discovery Brief.

  **If UI is NOT detected:**
  Set UI Direction to: "N/A — no UI components".

  ## Step 4c. Present Discovery Brief (Brainstorm with User)

  Use `AskUserQuestion` to present the Discoverer's findings as a conversation. Actively invite
  the user to challenge, redirect, or simplify. Use this format:

  ```
  ## Discovery Brief — [feature title]

  ### What I Understand
  [1-2 sentences on the underlying problem/goal, not just the stated request]

  ### What Already Exists
  **In codebase:** [existing code, patterns, modules — with file paths]
  **External:** [libraries, tools, patterns — with URLs]

  ### Build or Reuse?
  [Decision and rationale. If building: why existing solutions don't fit.]

  ### Approaches Considered
  **A: [name]** — [description]
  - Build vs reuse: [what's new vs existing]
  - Pros: [list]  Cons: [list]  Effort: [small/medium/large]

  **B: [name]** — [description]
  - Build vs reuse: [what's new vs existing]
  - Pros: [list]  Cons: [list]  Effort: [small/medium/large]

  [**C: [name]** — if applicable]

  **Recommendation:** [which approach and why — bias toward simplest]

  ### Personas
  - [persona 1]

  ### Use Cases
  - UC-1: [title] — [description]
  - UC-E1: [title] — [description]

  ### Scope
  **In scope:** [list]
  **Out of scope:** [list]

  ### UI Direction
  [playground summary or N/A]

  ### Technical Context
  - [key files/modules — file paths + line numbers]
  - [library versions and constraints]
  - [integration points]

  ### Open Questions
  - [anything unresolved]

  Which approach do you prefer? Or is there a different angle I should consider?
  ```

  Wait for the user's response. This is a brainstorm — the user may redirect entirely, pick a
  different approach, or simplify further. Incorporate feedback and re-present if needed (max 2
  rounds).

  ## Hold Discovery Brief in Memory

  The approved Discovery Brief (including chosen approach, build/reuse decision, and technical
  context) lives in conversation memory until `generate-artifacts`, when it is written to
  `openspec/changes/$FEATURE_ID/discovery.md`. This is the primary input to the Architect in
  `design`.
