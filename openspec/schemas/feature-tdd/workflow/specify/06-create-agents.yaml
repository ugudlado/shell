id: create-agents
phase: specify
order: 6
description: Spawn Researcher then Architect sequentially; feed findings forward to produce spec and design artifacts

agents:
  researcher:
    tool: Agent
    name: researcher
    model: sonnet
    subagent_type: researcher
    sequencing: first
    skills:
      - feature-dev:code-explorer
    output: structured findings (file paths, code patterns, constraints)

  architect:
    tool: Agent
    name: architect
    model: opus
    subagent_type: architect
    sequencing: second   # receives researcher findings as input
    skills:
      - feature-dev:code-architect
    produces:
      feature-tdd: [spec.md, design.md]
      feature-rapid: [spec.md, design.md]
      bugfix: [diagnosis.md, fix-plan.md]
    deferred: tasks.md   # tasks generated by /implement, not here

staff_engineer_bar:
  architect:
    - Challenges assumptions — proposes alternative approaches before settling on a design
    - Surfaces gaps proactively; considers long-term system health
    - Questions whether the feature should be built this way, not just whether it can be
    - Uses Discovery Brief as the primary source of truth for requirements
    - Maps every use case to at least one acceptance criterion (format: [traces: UC-N])
    - Uses Researcher findings to ground decisions in actual codebase state
  researcher:
    - Thorough, precise, evidence-based
    - Every finding includes file paths, line numbers, and concrete data
    - No assumptions — only verified facts from the codebase

additional_research:
  trigger: architect_needs_more_data
  action: spawn_new_researcher
  feed_back_via: SendMessage to architect

instruction: |
  ## Orchestration Model

  The main session orchestrates two agents sequentially. Agents do not communicate directly
  with each other — all data flows through the main session.

  ## Step 6.1 — Spawn Researcher

  Use the Agent tool with:
  - `name: "researcher"`
  - `model: "sonnet"`
  - `subagent_type: "researcher"`

  Provide the Researcher with:
  - FEATURE_DESC from step 01
  - Memory search results from step 02
  - Instructions to explore the codebase:
    - Identify relevant files, modules, and packages
    - Find existing patterns that this feature should follow
    - Locate prior implementations of similar features (prior art)
    - Document library usage and version constraints
    - Identify integration points and potential constraints
    - Return all findings as structured data: file paths, line numbers, code patterns, library names

  The Researcher must include file paths and line numbers for every claim. No assertions without
  evidence.

  ## Step 6.2 — Spawn Architect

  After the Researcher returns findings, use the Agent tool with:
  - `name: "architect"`
  - `model: "opus"`
  - `subagent_type: "architect"`

  Provide the Architect with:
  - FEATURE_DESC from step 01
  - SCHEMA from step 01 (feature-tdd / feature-rapid / bugfix)
  - Memory search results from step 02
  - Researcher findings from step 6.1 (full structured output)
  - Approved Discovery Brief from step 05 (use cases, scope, UI direction, key decisions)

  Instruct the Architect to:
  1. Synthesize all inputs into OpenSpec artifacts (spec.md, design.md — or diagnosis.md,
     fix-plan.md for bugfix)
  2. Challenge assumptions — propose and evaluate alternative approaches before settling
  3. Map every use case from the Discovery Brief to at least one acceptance criterion in spec.md,
     using the format `[traces: UC-N]` appended to each criterion
  4. Do NOT generate tasks.md — tasks are generated by /implement
  5. Operate at the staff engineer bar (see config above)

  ## Step 6.3 — Additional Research (if needed)

  If the Architect signals it needs more codebase data:
  1. The main session spawns a new Researcher agent with the specific question
  2. Researcher returns findings
  3. Main session sends findings to the continued Architect session via SendMessage

  ## Quality Reminder

  The quality bar starts here. Gaps in the spec become bugs in the implementation. The Architect
  owns artifact quality — both what the spec says and what it omits.
