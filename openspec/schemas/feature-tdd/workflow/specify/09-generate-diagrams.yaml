id: generate-diagrams
phase: specify
order: 9
description: Assess feature complexity, generate Mermaid diagrams, render via draw.io, and link from spec.md

complexity_levels:
  small:
    diagrams: []
    notes: simple features may not need diagrams — architect decides
  medium:
    diagrams: [architecture.mmd]
  large:
    diagrams: [architecture.mmd, flow.mmd]
  refactor:
    diagrams: [before.mmd, after.mmd]

diagram_types:
  architecture.mmd: overall system architecture — how components connect
  flow.mmd: control flow or data flow through the feature
  before.mmd: current state before the change (refactors and large features)
  after.mmd: target state after the change (refactors and large features)

output_dir: "openspec/changes/$FEATURE_ID/diagrams/"

tools:
  - Agent (feature-dev:code-architect subagent)
  - mcp__drawio__open_drawio_mermaid

instruction: |
  ## Dispatch Architect for Diagram Assessment

  Use the Agent tool to spawn a `feature-dev:code-architect` agent. Provide it with the full
  spec.md content and ask it to:

  1. Assess feature complexity: small / medium / large / refactor
  2. Decide which diagram types best communicate the architecture (per the complexity config above)
  3. Generate valid Mermaid syntax for each selected diagram type

  The architect has latitude to add a flow.mmd for medium features if the data flow is
  non-obvious, or skip architecture.mmd for trivially simple features.

  ## Save Diagram Files

  Create the diagrams directory:
  ```bash
  mkdir -p "openspec/changes/$FEATURE_ID/diagrams/"
  ```

  Write each diagram the architect produced as a `.mmd` file in that directory:
  - `openspec/changes/$FEATURE_ID/diagrams/architecture.mmd`
  - `openspec/changes/$FEATURE_ID/diagrams/flow.mmd`
  - `openspec/changes/$FEATURE_ID/diagrams/before.mmd`
  - `openspec/changes/$FEATURE_ID/diagrams/after.mmd`

  Only write the files the architect determined were appropriate.

  ## Render via draw.io

  For each `.mmd` file written, call:
  ```
  mcp__drawio__open_drawio_mermaid(content: "<mermaid source>")
  ```

  This renders the diagram interactively. Note any rendering errors and correct the Mermaid
  syntax if needed.

  ## Update spec.md

  Append a `## Diagrams` section to `openspec/changes/$FEATURE_ID/spec.md` referencing each
  diagram file:

  ```markdown
  ## Diagrams

  - [Architecture](diagrams/architecture.mmd)
  - [Data Flow](diagrams/flow.mmd)
  ```

  Only list diagrams that were actually generated.

  ## Skip Condition

  If the architect determines the feature is small and no diagrams are warranted, skip file
  creation and rendering. Do not add a Diagrams section to spec.md in that case.
