id: create-ticket
phase: specify
order: 3
description: Create Linear ticket using feature description, extract ticket ID for use in identifier

skip_when: no_linear == true

tools:
  - mcp__plugin_linear_linear__save_issue

linear:
  team_name: Home Labs
  team_id: 80452c36-1579-49d6-9e6e-59afbb82bce5
  ticket_prefix: HL
  update_after_artifacts: true

instruction: |
  ## Check Skip Condition

  If `NO_LINEAR` is true (flag `--no-linear` was passed in `parse-args`), skip this entire step.
  Record `LINEAR_ID = null` and continue.

  ## Create Linear Ticket

  Call `mcp__plugin_linear_linear__save_issue` with:
  - `title`: a concise title derived from FEATURE_DESC (10 words or fewer)
  - `description`: the full FEATURE_DESC text
  - `teamId`: 80452c36-1579-49d6-9e6e-59afbb82bce5

  ## Extract Linear ID

  From the response, extract the issue identifier — format is `HL-NNN` (e.g., `HL-80`).

  Store this as `LINEAR_ID`.

  ## Carry Forward

  `LINEAR_ID` is used in:
  - `generate-id-worktree`: `[LINEAR_ID]-[slug]`
  - `generate-artifacts`: written to `.openspec.yaml` as `linear-ticket`
  - `store-commit-report`: description updated with artifact links
