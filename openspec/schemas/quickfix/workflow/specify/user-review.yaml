id: user-review
phase: specify
order: 6
description: Present the spec to the user for approval; wait for confirmation or incorporate feedback

tools:
  - AskUserQuestion

artifacts_to_present:
  - $OPENSPEC_CHANGES_DIR/$FEATURE_ID/spec.md

instruction: |
  ## Present Spec

  Use `AskUserQuestion` to present the generated spec. Summarize the key points inline
  so the user can review without opening files:

  - **What**: the change description
  - **Requirements**: numbered list
  - **Files Affected**: list of files
  - **Acceptance Criteria**: how we'll verify it works

  Ask the user to:
  - Approve and proceed, or
  - Request specific changes to the spec

  Wait for their response before proceeding.

  ## Incorporate Feedback

  If the user requests changes:
  1. Update spec.md directly.
  2. Re-present updated spec via AskUserQuestion.

  There is no hard limit on feedback rounds — continue until the user explicitly approves.

  ## On Approval

  User has confirmed the spec. Proceed to `store-commit-report`.
