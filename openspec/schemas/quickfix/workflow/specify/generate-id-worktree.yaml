id: generate-id-worktree
phase: specify
order: 4
description: Derive feature identifier from Linear ID or date plus slug, then create the worktree via EnterWorktree

identifier:
  slug_rules:
    case: lowercase
    separator: hyphen
    max_chars: 50
    source: FEATURE_DESC
  formats:
    with_linear: "[LINEAR_ID]-[slug]"
    without_linear: "[YYYY-MM-DD]-[slug]"

worktree:
  path_pattern: "~/code/feature_worktrees/[FEATURE_ID]"
  branch_pattern: "quickfix/[FEATURE_ID]"
  tool: EnterWorktree

worktree_hook:
  name: worktree-create.sh
  event: WorktreeCreate
  automated_actions:
    - creates worktree at path_pattern
    - creates branch at branch_pattern
    - symlinks .env* files from main repo
    - installs dependencies (pnpm/npm/yarn)

instruction: |
  ## Generate Identifier

  Derive a short slug from FEATURE_DESC:
  - Lowercase only
  - Spaces and special characters → hyphens
  - Drop stop words (a, an, the, for, to, etc.) if needed to stay under 50 chars
  - Maximum 50 characters

  Build FEATURE_ID:
  - If LINEAR_ID is set (`create-ticket` created a ticket): `[LINEAR_ID]-[slug]`
    Example: `HL-80-update-config`
  - If NO_LINEAR is true (--no-linear flag): `[YYYY-MM-DD]-[slug]`
    Example: `2026-03-02-update-config`
    Use today's date in YYYY-MM-DD format.

  Store as `FEATURE_ID`.

  ## Create Worktree

  Call `EnterWorktree({ name: "$FEATURE_ID" })`.

  The WorktreeCreate hook (worktree-create.sh) automatically handles:
  - Creating the worktree at `~/code/feature_worktrees/$FEATURE_ID`
  - Creating branch `quickfix/$FEATURE_ID`
  - Symlinking `.env*` files from the main repo
  - Installing dependencies

  After EnterWorktree returns, the session's working directory is inside the new worktree.
  Store `WORKTREE_PATH = ~/code/feature_worktrees/$FEATURE_ID`.

  ## Verify

  Confirm the worktree directory exists before proceeding:
  ```bash
  ls "$WORKTREE_PATH"
  git -C "$WORKTREE_PATH" branch --show-current
  ```

  Expected: branch shows `quickfix/$FEATURE_ID`.

  ## Create Flux Task

  Check if Flux is available: run `which flux 2>/dev/null`. If not found, log
  "[flux] not installed — skipping Flux task creation" and skip this section.

  Check idempotency: read `.openspec.yaml` — if `flux-task-id` is already set
  (not empty/TBD), skip task creation.

  Get the repo project name: `basename "$(git rev-parse --show-toplevel)"`.

  Create the Flux task:
    flux task create <project-name> "<LINEAR_ID or FEATURE_ID>: <feature title>" -P 1

  Capture the task ID from the output (Flux outputs the created task ID).
  Update `.openspec.yaml`: set `flux-task-id: <captured-id>`.

  If LINEAR_ID exists, add the Linear link:
    flux task update <flux-task-id> --note "Linear: https://linear.app/home-labs/issue/<LINEAR_ID>"

  If any flux command fails, log a warning and continue — never block the workflow.

  ## Clean Flux CLAUDE.md Injection

  Flux's `init` command auto-injects a `<!-- FLUX:START -->...<!-- FLUX:END -->` block into
  CLAUDE.md or AGENTS.md. Remove it if present — we manage agent instructions ourselves.

  Check both files and strip the block:
    sed -i '' '/<!-- FLUX:START -->/,/<!-- FLUX:END -->/d' CLAUDE.md 2>/dev/null || true
    sed -i '' '/<!-- FLUX:START -->/,/<!-- FLUX:END -->/d' AGENTS.md 2>/dev/null || true
