id: search-memory
phase: specify
order: 2
description: Search claude-mem for relevant patterns and past decisions before any codebase work

tools:
  - mcp__plugin_claude-mem_mcp-search__search

instruction: |
  ## Search Memory

  Call `mcp__plugin_claude-mem_mcp-search__search` before doing any other work.

  Search for terms derived from the feature description (from `parse-args`):
  - Key nouns from FEATURE_DESC (e.g., "auth", "config", "hooks")
  - Technical terms that appear in the description
  - Any Linear ticket ID if known at this point

  ## Collect and Note Results

  Read the search results and note:
  - Prior architectural decisions relevant to this change
  - Patterns or conventions already established in the codebase
  - Feedback memories that might affect approach

  ## Carry Forward

  Memory results stay in conversation context and are available to all subsequent steps.
  Do not skip this step even if results are empty — the empty result itself is useful signal.
