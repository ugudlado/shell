id: generate-artifacts
phase: specify
order: 5
description: Scaffold change directory, write .openspec.yaml, then generate lightweight spec directly (no discovery, no design, no diagrams)

openspec_cli:
  scaffold_command: "openspec new change $FEATURE_ID"
  creates: "$OPENSPEC_CHANGES_DIR/$FEATURE_ID/"

artifact_order:
  quickfix: [spec]

openspec_yaml_template:
  schema: quickfix
  feature-id: "<FEATURE_ID>"
  linear-ticket: "<HL-NNN or none>"
  worktree: "~/code/feature_worktrees/<FEATURE_ID>"
  branch: "quickfix/<FEATURE_ID>"

artifact_ownership:
  openspec_yaml: main_session
  spec_md: main_session   # no architect agent — main session writes the spec directly

instruction: |
  ## Scaffold Change Directory

  From within WORKTREE_PATH, run:
  ```bash
  cd "$WORKTREE_PATH"
  openspec new change "$FEATURE_ID"
  ```

  This creates `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/` with a starter `.openspec.yaml`.

  ## Write .openspec.yaml

  Overwrite `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/.openspec.yaml` with per-change metadata:
  ```yaml
  schema: quickfix
  feature-id: <FEATURE_ID>
  linear-ticket: <LINEAR_ID or "none">
  worktree: ~/code/feature_worktrees/<FEATURE_ID>
  branch: quickfix/<FEATURE_ID>
  ```

  Fill in all values from prior steps.

  ## Generate Lightweight Spec

  Write `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/spec.md` directly (no architect agent needed).
  Use the template at `openspec/schemas/quickfix/templates/spec.md`.

  Fill in from FEATURE_DESC and codebase knowledge:
  - **What**: One paragraph describing the change
  - **Why**: Motivation and context
  - **Requirements**: Numbered list of concrete requirements
  - **Files Affected**: List of files to create, modify, or delete (read the codebase to identify these)
  - **Acceptance Criteria**: Testable criteria for verification
  - **Risk**: Low/Medium assessment with edge cases

  Keep it concise — this is a quick fix, not a feature spec. Aim for 20-40 lines total.

  ## Verify

  After spec is written, run:
  ```bash
  openspec status --change "$FEATURE_ID" --json
  ```
  Confirm spec shows status DONE before proceeding.
