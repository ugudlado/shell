id: review
phase: implement
order: 8
description: Reviewer scores the implementation against spec and coding standards

agent: reviewer

review:
  score_threshold: 9
  score_dimensions: [correctness, security, simplicity, spec_adherence]

instruction: |
  ## Context

  For each task in `state.yaml.current_tasks` where step == "review":
  - Implementer's change summary and files modified (from state)
  - Spec content
  - Review against spec adherence and coding standards

  ## Expected Output

  Score 1-10 across configured dimensions. Approve or reject with feedback.

  ## State Update

  **Score >= 9 (approved):** advance step to `verify`:
  ```yaml
  current_tasks:
    - task_id: "T-1"
      step: verify
      review_score: 9
      review_approved: true
  ```

  **Score < 9 (rejected):** advance step to `retry`:
  ```yaml
  current_tasks:
    - task_id: "T-1"
      step: retry
      review_score: 6
      review_approved: false
      review_feedback: "<rejection details>"
  ```
