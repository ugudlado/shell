id: signoff-gate
phase: implement
order: 15
description: Present final review results to user for approval — no architect/verifier signoff for quickfix

signoff_clean_gate:
  all_must_pass:
    - phase-review score >= 9/10
    - zero critical findings
    - zero important findings (or explicitly accepted by user)
    - all tests pass (if tests exist), build succeeds, types check

instruction: |
  ## Aggregate Results

  Collect findings from final-review. No separate architect/verifier signoff
  for quickfix — the final review is sufficient for small changes.

  ## If Clean — Present to User

  Only present when all `signoff_clean_gate` criteria pass.

  Use `AskUserQuestion` to present:
  - Final Review Report (per-reviewer scores and findings)
  - Summary of all commits
  - Ask user to approve before marking ready for `/complete-feature`

  Do not run `/complete-feature` without explicit user approval.

  ## If Not Clean

  If final-review failed after max iterations, findings have already been
  escalated to the user in the final-review step. Wait for user direction.
