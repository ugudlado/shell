id: final-validation
phase: implement
order: 13
description: Verify all tasks completed and all checks pass before entering the review pipeline

checks:
  - name: task_completion
    tool: TaskList
    expected: all tasks in `completed` state
  - name: build
    command: pnpm build
    evidence: read full output, confirm exit code 0
  - name: git_status
    command: git status
    expected: clean working tree

tasks_md_sync:
  trigger: after all tasks complete (final sync)
  template: openspec/schemas/quickfix/templates/tasks.md
  target: openspec/changes/$FEATURE_ID/tasks.md
  commit: include in final validation commit

instruction: |
  ## Final Validation

  Before entering the review pipeline, confirm all implementation work is complete.

  ### Validate Completion

  1. Run `TaskList` — every task must be `completed`. If any task is still
     `pending` or `in_progress`, route back to pick-task.

  2. Run checks:
     ```bash
     pnpm build
     git status
     ```

  3. Confirm:
     - `pnpm build`: exits 0, no build errors
     - `git status`: clean working tree — commit uncommitted changes first

  If any check fails: create a task via TaskCreate (phase: "Validation Fixes"),
  then route back to pick-task.

  ### Final tasks.md Sync

  After all tasks confirmed completed, do a final sync of tasks.md:
  1. Run `TaskList` + `TaskGet` for all tasks
  2. Overwrite tasks.md using quickfix template
  3. Commit:
     ```bash
     git add openspec/changes/$FEATURE_ID/tasks.md
     git commit -m "chore: [FEATURE_ID] final tasks.md sync

     Co-Authored-By: Claude <noreply@anthropic.com>"
     ```

  Only after all checks pass AND tasks.md is committed, proceed to `final-review`.
