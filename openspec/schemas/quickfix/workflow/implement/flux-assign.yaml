id: flux-assign
phase: implement
order: 0
description: Check Flux ready queue, claim the feature task/epic, and set executor — replaces develop-next and self-assign-and-implement from command files

skip_when: flux.mode == unavailable

instruction: |
  ## Check Flux Availability

  Read `flux:` block from `.openspec.yaml`. If `mode` is `unavailable` or missing, skip this step entirely.

  ```bash
  which flux >/dev/null 2>&1 || { echo "[flux-assign] skipped — CLI not available"; exit 0; }
  ```

  ## Resolve Project

  ```bash
  REPO=$(basename "$(git rev-parse --show-toplevel)")
  PROJECT_ID=$(flux project list --json | jq -r --arg n "$REPO" '.[] | select(.name == $n) | .id')
  ```

  If PROJECT_ID is empty, log warning and skip.

  ## Check Ready Queue (develop-next)

  ```bash
  flux ready "$PROJECT_ID" --json
  ```

  Cross-check: is the current feature's Flux task/epic among the top ready items?
  If not, inform the user: `[flux-assign] Note: current feature is not the top ready item on the board.`
  Do NOT block — proceed regardless.

  ## Claim Task / Epic (self-assign)

  Read `flux:` block from `.openspec.yaml`:

  **Epic mode** (`flux.mode == epic`):
  ```bash
  flux epic update <flux.epic-id> --status in_progress
  ```

  **Task mode** (`flux.mode == task`):
  ```bash
  flux task start <flux.umbrella-task-id>
  ```

  ## Set Executor

  If `FLUX_EXECUTOR` environment variable is set:

  ```bash
  EXEC_LABEL=$(case "${FLUX_EXECUTOR:-}" in
    claude) echo "Executor: Claude" ;;
    cursor) echo "Executor: Cursor" ;;
    codex)  echo "Executor: Codex" ;;
    gemini) echo "Executor: Gemini" ;;
    *)      echo "" ;;
  esac)
  ```

  **Epic mode:**
  ```bash
  [ -n "$EXEC_LABEL" ] && flux epic update <flux.epic-id> --note "$EXEC_LABEL"
  ```

  **Task mode:**
  ```bash
  [ -n "$EXEC_LABEL" ] && flux task update <flux.umbrella-task-id> --note "$EXEC_LABEL"
  ```

  ## Error Handling

  On any Flux error: log warning and continue. Never block implementation on Flux.
