id: phase-verification
phase: implement
order: 11
description: Verify each completed phase with static checks and acceptance criteria check before committing

static_checks:
  - command: pnpm type-check
    required: true
  - command: pnpm test
    required: false   # run if tests exist, skip gracefully if not
  - command: pnpm build
    required: true

score_threshold: 9
max_fix_iterations: 3

skills:
  debugging: systematic-debugging

instruction: |
  Run this step after all tasks in a phase are marked "completed".

  ## Static Verification

  Run checks and read the full output of each:

  1. Type check:
     ```bash
     pnpm type-check
     ```

  2. Tests (if they exist):
     ```bash
     pnpm test 2>/dev/null || echo "No tests found — skipping"
     ```
     If tests exist, they must pass. If no test script or no test files, skip gracefully.

  3. Build:
     ```bash
     pnpm build
     ```

  Read the output of each command. Confirm exit codes are 0 and count any failures.
  If any required check fails, invoke `systematic-debugging` — do NOT guess-fix.

  ## Acceptance Criteria Check

  Read `openspec/changes/$FEATURE_ID/spec.md` and find the acceptance criteria.

  For each criterion:
  - Verify it with concrete evidence from the static checks or by reading the code
  - Document whether the criterion is met

  Only claim phase completion after all criteria have evidence.

  ## Phase Score Gate

  Score the phase 1-10 based on:
  - **Static verification** (type-check, build clean; tests pass if they exist)
  - **Acceptance criteria** (all criteria met with evidence)

  Score outcomes:
  - Score >= 9: Proceed to commit-phase.
  - Score < 9: Create tasks for each gap via TaskCreate (phase: "Phase Verify Fixes"),
    then route back to pick-task.
  - If the same gap persists after 3 cycles: escalate to user via `AskUserQuestion`.
