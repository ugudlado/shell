name: quickfix
version: 1
description: >
  Lightweight workflow for small, low-risk changes. Shorter cycle time with no
  discovery phase and no diagrams. Use for config tweaks, small refactors,
  dependency bumps, documentation updates, and simple one-file changes.

artifacts:
  - id: spec
    generates: spec.md
    description: Lightweight specification — what, why, requirements, acceptance criteria
    template: spec.md
    requires: []

  - id: tasks
    generates: tasks.md
    description: Minimal task list with dependencies
    template: tasks.md
    requires:
      - spec

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Work through tasks in order. Mark [→] when starting, [x] when done.
    Tasks marked [P] can run in parallel. Respect (depends: Txxx) annotations.

    QUICKFIX RULES:
    - No discovery phase — spec is generated directly from feature description
    - No diagrams — changes are small enough to understand without visuals
    - Tests optional — add tests only if the change touches testable logic
    - Keep changes minimal — quick fixes should be surgical, not exploratory

    PHASE GATES:
    - Run: type-check, build (run test if tests exist)
    - Invoke `phase-review` skill — target >= 9/10
    - If UI components changed: invoke `/critique` for UX review
    - Max 3 iterations to fix feedback, then escalate
    - Auto-commit after phase passes review

    FINAL REVIEW (in parallel):
    - `phase-review` skill (Codex + Claude code reviewer)
    - pr-review-toolkit:silent-failure-hunter

    VERIFICATION BUGS:
    - If verification reveals new issues, add them as tasks in the current phase
    - Do NOT skip to the next phase with known issues
    - New tasks get the next available T-number with a letter suffix (e.g., T-3b)
    - Each new task must have Why, Files, and Verify fields

    ON FAILURE: Invoke `systematic-debugging` skill. No guess-fixes.
    COMMIT PREFIX: chore: | fix: | feat:   (choose based on change type)

workflow:
  phases:
    specify:
      steps: workflow/specify/
      entry: ["No change directory exists for this feature"]
      exit: ["Spec artifact DONE", "User approved", "Committed"]
    implement:
      steps: workflow/implement/
      entry: ["All applyRequires artifacts DONE", "Worktree exists"]
      exit: ["All tasks completed", "Signoff clean", "User approved"]
    complete:
      steps: ../feature-tdd/workflow/complete/
      entry: ["All tasks completed", "Signoff passed"]
      exit: ["Merged to main", "Worktree removed"]
