id: store-commit-report
phase: diagnose
order: 9
description: Save diagnosis decisions as memory, commit artifacts to feature branch, update Linear, and output the final report

memory:
  tool: auto_memory   # file-based auto memory
  type: project
  directory: project memory directory
  naming_pattern: "project_[FEATURE_ID]_[topic].md"
  content_per_file:
    - root cause and why it occurred
    - fix approach and trade-offs considered
    - related subsystems or code paths ruled out
    - why alternative fixes were not chosen

commit:
  working_dir: WORKTREE_PATH
  stage: openspec/
  message_format: |
    fix: add diagnosis and fix plan for $FEATURE_ID

    Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>

linear_update:
  skip_when: no_linear == true
  tool: mcp__plugin_linear_linear__save_issue
  fields:
    description: |
      [diagnosis summary and fix approach]
      Worktree: ~/code/feature_worktrees/<FEATURE_ID>
      Artifacts: $OPENSPEC_CHANGES_DIR/<FEATURE_ID>/

report:
  fields:
    - Linear ticket ID and URL (if created)
    - Feature ID
    - Worktree path
    - Change directory
    - Artifacts list
    - Branch name
    - Next step

instruction: |
  ## Store Decisions in Memory

  Write one auto memory file per significant decision area to the project memory directory.
  File naming: `project_[FEATURE_ID]_[topic].md`

  Each file should cover one cohesive topic and include:
  - The root cause that was identified and why it occurred
  - The fix approach chosen and its rationale
  - Trade-offs that were evaluated
  - Related subsystems or code paths that were investigated and ruled out
  - Why alternative fix approaches were rejected

  Topics typically include: root cause analysis, fix strategy, risk decisions.
  Cover only topics where real decisions were made.

  ## Commit Artifacts

  Stage and commit all OpenSpec artifacts on the feature branch:

  ```bash
  cd "$WORKTREE_PATH"
  git add openspec/
  git commit -m "$(cat <<'EOF'
  fix: add diagnosis and fix plan for $FEATURE_ID

  Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>
  EOF
  )"
  ```

  Substitute the actual FEATURE_ID into the commit message.

  ## Update Linear Ticket (unless --no-linear)

  If LINEAR_ID is set, call `mcp__plugin_linear_linear__save_issue` to update the ticket:
  - Description: diagnosis summary, root cause, fix approach, worktree path, links to artifact files
  - Do not change the title or team ID

  ## Output Report

  Print the final report:

  ```
  Bug diagnosis complete.

  Linear ticket: [LINEAR_ID] — [URL]     (omit if --no-linear)
  Feature ID:    [FEATURE_ID]
  Worktree:      ~/code/feature_worktrees/[FEATURE_ID]
  Branch:        feature/[FEATURE_ID]
  Change:        $OPENSPEC_CHANGES_DIR/[FEATURE_ID]/
  Artifacts:
    - diagnosis.md
    - fix-plan.md

  Ready for: /implement [FEATURE_ID]
  ```

  Omit the Linear line if --no-linear was used.
