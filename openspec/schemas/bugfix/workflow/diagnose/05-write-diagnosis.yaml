id: write-diagnosis
phase: diagnose
order: 5
description: Write diagnosis.md with symptoms, reproduction steps, and root cause analysis; write fix-plan.md with approach, affected files, and risk assessment

artifacts:
  diagnosis_md:
    sections:
      - symptoms
      - reproduction_steps
      - root_cause
      - affected_files
  fix_plan_md:
    sections:
      - approach
      - affected_files
      - risk_assessment
      - out_of_scope

instruction: |
  ## Write diagnosis.md

  Using the investigation findings from step 04, write a complete `diagnosis.md`.
  Hold it in conversation memory — it will be written to disk in step 07.

  Structure:

  ```markdown
  # Diagnosis: [bug title]

  ## Symptoms

  Observable behavior reported and/or confirmed during investigation:
  - [symptom 1 — what the user sees or what fails]
  - [symptom 2]
  - ...

  ## Reproduction Steps

  Minimal steps to trigger the bug:
  1. [precondition: system state required]
  2. [action: what to do]
  3. [expected: what should happen]
  4. [actual: what happens instead]

  Include any curl commands, test runs, or code snippets that demonstrate the reproduction.

  ## Root Cause

  [Precise statement of what is wrong and why.]

  File: `[path/to/file.ts]`
  Function/Location: `[functionName]` (lines N–M)

  [Explanation of the defect: what invariant is violated, what condition is wrong,
  what data flow is broken. Be specific — not "the validation is wrong" but
  "the guard `if (x > 0)` should be `if (x >= 0)` because zero is a valid value per
  the schema definition in types.ts line 42".]

  ## Affected Files

  Files that contain the defect or must change:
  - `[file1.ts]` — [why it's affected]
  - `[file2.ts]` — [why it's affected]
  ```

  ## Write fix-plan.md

  Using the investigation findings and diagnosis, write a complete `fix-plan.md`.
  Hold it in conversation memory — it will be written to disk in step 07.

  Structure:

  ```markdown
  # Fix Plan: [bug title]

  ## Approach

  [Description of the fix strategy. Be specific: what code changes, what logic
  changes, what the corrected invariant looks like. Prefer minimal, targeted changes
  over broad refactors — fix the root cause only.]

  ## Affected Files

  | File | Change |
  |------|--------|
  | `[file1.ts]` | [what changes and why] |
  | `[file2.ts]` | [what changes and why] |

  ## Risk Assessment

  - **Blast radius**: [which parts of the system could be affected by this fix]
  - **Regression risk**: [what existing behavior might break, and how to verify it won't]
  - **Side effects**: [any other behavior that changes as a result of this fix]

  ## Out of Scope

  The following related issues are intentionally NOT addressed by this fix:
  - [related issue 1 — reason it's deferred]
  - [related issue 2]

  Leave a TODO comment in code if a follow-up is planned.
  ```
