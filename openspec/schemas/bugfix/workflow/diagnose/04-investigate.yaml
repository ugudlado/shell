id: investigate
phase: diagnose
order: 4
description: Root cause investigation — explore codebase for symptoms, reproduction steps, and root cause

tools:
  - Grep
  - Glob
  - Read
  - Bash

skills:
  - systematic-debugging   # Phase 1 investigation: reproduce → isolate → identify root cause

instruction: |
  ## Root Cause Investigation

  Invoke the `systematic-debugging` skill for Phase 1 (Reproduce and Isolate).
  Use BUG_DESC and memory search results from step 02 as context.

  ### Phase 1a: Reproduce the Bug

  Attempt to reproduce the reported symptoms:

  1. Read BUG_DESC and identify observable symptoms (error messages, wrong output,
     crash conditions, unexpected behavior).

  2. Explore the codebase to find where the reported behavior originates:
     - Use Grep to search for relevant symbols, error strings, and function names from BUG_DESC
     - Use Glob to locate likely files (components, routes, handlers, utils)
     - Use Read to understand the affected code paths

  3. Use Bash to run any available reproduction steps (tests, scripts, curl calls).
     Confirm the symptom is reproducible before proceeding.

  ### Phase 1b: Isolate the Defect

  Narrow the scope from symptom to root cause:

  1. Trace the execution path from the reported symptom back to its origin.
     Follow the call chain: what calls what, where data comes from, where state is mutated.

  2. Identify the minimal set of conditions required to trigger the bug.

  3. Rule out adjacent code paths — confirm which parts of the system are NOT involved.

  ### Phase 1c: Identify Root Cause

  State the root cause precisely:

  - What code is wrong (file, function, line range)?
  - Why is it wrong (off-by-one, wrong condition, missing guard, race condition, etc.)?
  - What invariant is being violated?
  - Is this a regression (did something change that broke it) or a latent defect?

  ### Phase 1d: Assess Risk and Scope

  Before writing the diagnosis:

  - Which files must change to fix the root cause?
  - Are there related code paths that have the same defect pattern?
  - What is the blast radius of the fix — could fixing this break something else?
  - Is a workaround in place that the fix must remove?

  ## Carry Forward

  Investigation findings (symptoms, reproduction steps, root cause, affected files, risk) are
  passed as context to step 05-write-diagnosis. Hold them in conversation memory.
