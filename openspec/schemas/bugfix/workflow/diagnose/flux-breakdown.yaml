id: flux-breakdown
phase: diagnose
order: 13
description: Create Flux epic or task for the feature based on phase count, write flux block to .openspec.yaml

skip_when: flux_unavailable

flux_mode_rules:
  epic: feature has multiple phases (## Phase headers in tasks.md or spec.md)
  task: feature fits in a single phase
  auto_promote: if generate-tasks later discovers multiple phases, it promotes task -> epic

openspec_yaml_flux_block:
  mode: epic | task | unavailable
  epic-id: "<id> | null"
  task-ids: {}
  umbrella-task-id: "<id> | null"

instruction: |
  ## Check Flux Availability

  ```bash
  which flux >/dev/null 2>&1 && echo "OK" || echo "MISSING"
  ```

  If flux CLI is missing or `FLUX_DATA` is unset:
  1. Add to `.openspec.yaml`:
     ```yaml
     flux:
       mode: unavailable
     ```
  2. Log: `[flux-breakdown] skipped — CLI not available`
  3. Stop this step. Downstream steps will check `flux.mode` and skip.

  ## Read Context

  Read `.openspec.yaml` for:
  - `feature-id` (FEATURE_ID)
  - `linear-ticket` (LINEAR_ID, may be "none")

  Read `spec.md` and/or `tasks.md` (if tasks.md was already generated during specify)
  to detect phase structure. Look for:
  - `## Phase` or `## P1`, `## P2` section headers
  - Multiple numbered phase groups in tasks.md
  - Explicit phase markers in the spec

  ## Resolve Flux Project

  ```bash
  REPO=$(basename "$(git rev-parse --show-toplevel)")
  PROJECT_ID=$(flux project list --json | jq -r --arg n "$REPO" '.[] | select(.name == $n) | .id')
  ```

  If PROJECT_ID is empty:
  ```bash
  flux project create "$REPO"
  PROJECT_ID=$(flux project list --json | jq -r --arg n "$REPO" '.[] | select(.name == $n) | .id')
  ```

  ## Decide: Epic or Task

  - **Multiple phases detected** → epic mode
  - **Single phase or no phase structure** → task mode

  ## Epic Mode

  ```bash
  flux epic create "$PROJECT_ID" "$LINEAR_ID: $TITLE" --note "OpenSpec: $FEATURE_ID"
  ```

  Capture the epic id from output. Then write to `.openspec.yaml`:

  ```yaml
  flux:
    mode: epic
    epic-id: <captured-epic-id>
    task-ids: {}
    umbrella-task-id: null
  ```

  ## Task Mode

  ```bash
  flux task create "$PROJECT_ID" "$LINEAR_ID: $TITLE" -P 1
  ```

  Capture the task id from output. Then write to `.openspec.yaml`:

  ```yaml
  flux:
    mode: task
    epic-id: null
    task-ids: {}
    umbrella-task-id: <captured-task-id>
  ```

  ## Add Linear Reference

  If LINEAR_ID is not "none":

  **Epic mode:**
  ```bash
  flux epic update <epic-id> --note "Linear: https://linear.app/home-labs/issue/$LINEAR_ID"
  ```

  **Task mode:**
  ```bash
  flux task update <umbrella-task-id> --note "Linear: https://linear.app/home-labs/issue/$LINEAR_ID"
  ```

  ## Assign Executor

  If `FLUX_EXECUTOR` environment variable is set:

  **Epic mode:**
  ```bash
  flux epic update <epic-id> --note "Executor: ${FLUX_EXECUTOR^}"
  ```

  **Task mode:**
  ```bash
  AGENT=$(case "$FLUX_EXECUTOR" in claude) echo "claude";; cursor) echo "other";; codex) echo "codex";; gemini) echo "gemini";; *) echo "";; esac)
  flux task update <umbrella-task-id> --note "Executor: ${FLUX_EXECUTOR^}"
  ```

  ## Commit

  ```bash
  git add openspec/changes/$FEATURE_ID/.openspec.yaml
  git commit -m "chore: add flux breakdown for $FEATURE_ID

  Co-Authored-By: Claude <noreply@anthropic.com>"
  ```

  ## Error Handling

  On ANY Flux CLI error during this step:
  1. Write `flux: { mode: unavailable }` to `.openspec.yaml`
  2. Log warning: `[flux-breakdown] Flux error — continuing without board sync`
  3. Continue to next workflow step. Never block specify on Flux.
