id: search-memory
phase: diagnose
order: 2
description: Search claude-mem for similar bugs, past fixes, and relevant patterns before any codebase work

tools:
  - mcp__plugin_claude-mem_mcp-search__search

instruction: |
  ## Search Memory

  Call `mcp__plugin_claude-mem_mcp-search__search` before doing any other work.

  Search for terms derived from the bug description (from step 01-parse-args):
  - Key nouns from BUG_DESC (e.g., "auth", "payment", "hook", "crash")
  - Technical terms that appear in the description (error messages, component names)
  - Any Linear ticket ID if known at this point

  ## Collect and Note Results

  Read the search results and note:
  - Prior bug fixes in the same area of the codebase
  - Patterns or known issues already documented
  - Libraries or subsystems that have had bugs before
  - Feedback memories about related system behavior
  - Spec or design decisions that affect the bug's domain

  ## Carry Forward

  Memory results stay in conversation context and are available to all subsequent steps.
  Do not skip this step even if results are empty — the empty result itself is useful signal.
