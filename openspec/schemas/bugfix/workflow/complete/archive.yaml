id: archive
phase: complete
order: 3
description: Copy OpenSpec artifacts from ~/.config/openspec/ to repo archive and commit

# Structured config
executor: haiku-agent
source: $OPENSPEC_CHANGES_DIR/$FEATURE_ID/
archive_destination: openspec/changes/archive/YYYY-MM-DD-$FEATURE_ID/
commit_format: "chore: archive specs for $FEATURE_ID"
commit_coauthor: "Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>"

instruction: |
  Copy completed OpenSpec artifacts from `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/`
  into the repo at `openspec/changes/archive/YYYY-MM-DD-$FEATURE_ID/`.

  Artifacts live in `~/.config/openspec/changes/$REPO_NAME/$FEATURE_ID/` during
  development. On completion, they are copied to the repo archive for permanent record.

  ```bash
  cd "$WORKTREE"
  DATE=$(date +%Y-%m-%d)
  ARCHIVE_DIR="openspec/changes/archive/${DATE}-${FEATURE_ID}"
  SOURCE_DIR="$OPENSPEC_CHANGES_DIR/$FEATURE_ID"

  mkdir -p "$ARCHIVE_DIR"
  cp -r "$SOURCE_DIR"/* "$ARCHIVE_DIR/" 2>/dev/null || true
  # Remove state.yaml from archive — it's operational, not archival
  rm -f "$ARCHIVE_DIR/state.yaml"
  ```

  Commit the archived specs:

  ```bash
  git add openspec/
  git commit -m "chore: archive specs for $FEATURE_ID

  Co-Authored-By: Claude Opus 4.6 <noreply@anthropic.com>"
  ```

  Clean up the active change directory:

  ```bash
  rm -rf "$SOURCE_DIR"
  ```
