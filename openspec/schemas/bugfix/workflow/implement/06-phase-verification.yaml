id: phase-verification
phase: implement
order: 6
description: Verify each completed phase with static checks, live server runtime verification, and fix criteria check before committing

static_checks:
  - command: pnpm type-check
    required: true
  - command: pnpm test:changed   # fallback to pnpm test if script not found
    required: true
    note: regression test must pass; zero other tests may break as a result of the fix
  - command: pnpm build
    required: true

regression_test_gate:
  required: true
  test_must_pass: the regression test written in Phase 2
  zero_regressions: no tests that were passing before the fix may now fail

score_threshold: 9
max_fix_iterations: 3

skills:
  debugging: systematic-debugging   # invoke if any static check fails
  phase_review: phase-review        # cross-model review at final review (step 8), not per-phase

chrome_devtools_tools:
  - mcp__chrome-devtools__navigate_page
  - mcp__chrome-devtools__take_snapshot
  - mcp__chrome-devtools__click
  - mcp__chrome-devtools__fill
  - mcp__chrome-devtools__type_text
  - mcp__chrome-devtools__press_key
  - mcp__chrome-devtools__take_screenshot
  - mcp__chrome-devtools__list_console_messages
  - mcp__chrome-devtools__list_network_requests

instruction: |
  Run this step after all tasks in a phase are marked "completed".

  ## 4a. Static Verification

  Run all three checks and read the full output of each:

  1. Type check:
     ```bash
     pnpm type-check
     ```
     (or the per-package equivalent from the project's CLAUDE.md)

  2. Tests:
     ```bash
     pnpm test:changed
     # fallback if script not found:
     pnpm test
     ```

     **Regression test gate (required for bugfix schema)**:
     - The regression test written in Phase 2 MUST pass
     - Zero tests that were passing before the fix may now fail
     - If any previously-passing test now fails, the fix has introduced a regression —
       treat this as a critical failure and invoke `systematic-debugging` before proceeding

  3. Build:
     ```bash
     pnpm build
     ```

  Read the output of each command. Confirm exit codes are 0 and count any failures.
  If any check fails, invoke `systematic-debugging` — do NOT guess-fix.

  ## 4b. Runtime Verification (mandatory)

  The dev server from step 04 is already running. Watch mode auto-reloads changes.
  Verify the fix works against the live server — no mocks.

  Determine which verification type applies based on what this phase touches:

  ### Backend Verification (API routes, data, server logic)

  1. Hit the affected endpoints with curl and verify real responses:
     ```bash
     # Use the dev URL from the project's CLAUDE.md
     curl -sf http://localhost:<PORT>/[endpoint] | jq .
     curl -sf -X PATCH http://localhost:<PORT>/[endpoint] \
       -H 'Content-Type: application/json' \
       -d '{"key":"value"}' | jq .
     ```

  2. Assert on response shape and data — check status codes, required fields, and correct values.
     "200 OK" alone is not sufficient — verify the response body matches what the fix-plan requires.

  3. Reproduce the original bug scenario from diagnosis.md and confirm it no longer triggers.

  4. Test error paths — send malformed input, missing params, and invalid values.
     Verify the server returns appropriate 4xx responses with error messages, not 500s or silent failures.

  5. Verify side effects:
     - If the endpoint writes to the filesystem, check that the file was written correctly.
     - If it triggers SSE events, connect to `/api/events` and confirm the event fires.

  ### UI Verification (components, pages, styling)

  1. Navigate to the affected page:
     ```
     mcp__chrome-devtools__navigate_page → http://localhost:<PORT>/[path]
     ```

  2. Reproduce the original bug scenario from diagnosis.md — confirm the symptom no longer occurs.

  3. Interact with the fixed area — do NOT just take a screenshot. Click buttons, fill forms, expand sections, toggle states:
     ```
     mcp__chrome-devtools__take_snapshot  → get fresh UIDs (always call immediately before using a UID)
     mcp__chrome-devtools__click          → interact with elements (requires uid, not text)
     mcp__chrome-devtools__fill           → enter data in inputs
     mcp__chrome-devtools__type_text      → type into fields
     mcp__chrome-devtools__press_key      → keyboard interactions
     ```
     Note: Chrome DevTools UIDs go stale on React re-renders. Always call take_snapshot immediately before any click/fill/hover. Never cache UIDs across async operations.

  4. Verify state changes — after interactions, take a new snapshot and confirm the DOM reflects the expected state.

  5. Check for console errors:
     ```
     mcp__chrome-devtools__list_console_messages
     ```
     Zero errors expected unless explicitly handling a known case.

  6. Check network requests:
     ```
     mcp__chrome-devtools__list_network_requests
     ```
     Verify the UI made the correct API calls with correct payloads.

  7. Take a screenshot as evidence:
     ```
     mcp__chrome-devtools__take_screenshot
     ```

  ### Full-Stack Verification (phase touches both)

  Run both backend AND UI verification above. Additionally, verify the round-trip:
  - Reproduce the bug scenario end-to-end and confirm it is resolved.
  - Verify no related paths were inadvertently broken.

  ## 4c. Fix Criteria Check

  Read `openspec/changes/$FEATURE_ID/fix-plan.md` and `openspec/changes/$FEATURE_ID/diagnosis.md`.

  For each symptom listed in diagnosis.md, verify with concrete evidence that it no longer occurs:
  - Provide response bodies, screenshots, or console output as proof
  - Document whether each symptom is now resolved or still present

  Verify the fix is minimal — confirm no unrelated code was changed by checking `git diff`.

  Only claim phase completion after all bug symptoms have evidence of resolution.

  ## 4d. Phase Score Gate

  Score the phase 1-10 based on:
  - **Static verification** (type-check, tests including regression test, build all clean) — failing any caps score at 5
  - **Regression test** (red before fix, green after) — failing this caps score at 5
  - **Zero new regressions** (no previously-passing tests broken) — any regression caps score at 5
  - **Runtime verification** (fix works against live server with evidence)
  - **Fix criteria** (all bug symptoms resolved with evidence, fix is minimal)

  Score outcomes:
  - Score >= 9: Proceed to commit (step 5a)
  - Score < 9: Identify specific gaps, fix them (invoke `systematic-debugging` if needed), re-run verification steps 4a through 4c, and re-score. Maximum 3 fix iterations.
  - Still < 9 after 3 iterations: Escalate to user via `AskUserQuestion` with the remaining gaps listed explicitly.
