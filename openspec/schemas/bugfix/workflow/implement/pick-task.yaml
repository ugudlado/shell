id: pick-task
phase: implement
order: 5
description: Select next ready task(s) from the task graph and update state

size_threshold:
  small:
    max_non_gate_tasks: 2
    mode: inline   # implement, self-review, and verify without spawning agents
  large:
    min_non_gate_tasks: 3
    mode: team_loop   # full agent pipeline per task

parallel:
  isolation: worktree
  file_conflict_check: required_before_dispatch
  merge_order: sequential_one_at_a_time
  post_merge_check: pnpm type-check

state_update:
  path: $OPENSPEC_CHANGES_DIR/$FEATURE_ID/state.yaml
  format:
    current_tasks:
      - task_id: "T-N"
        status: in_progress
        iteration: 1
        step: implement   # implement | review | verify
        parallel: false

instruction: |
  ## Task Graph Walk

  Run `TaskList` to identify:
  - Tasks with status "pending" (skip "completed" and "deleted")
  - Which pending tasks are "ready" — all `blockedBy` tasks are "completed"
  - Tasks with `metadata.parallel: true` that are ready and touch different files

  If no pending tasks remain, skip to phase verification.

  ## Select Tasks

  **Sequential tasks**: Pick the first ready task. Mark it `in_progress` via TaskUpdate.

  **Parallel tasks ([P])**: Verify each touches COMPLETELY different files. If any share
  files, run sequentially instead. For truly parallel tasks, mark all `in_progress`.

  ## Update State

  Write to `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/state.yaml`:
  ```yaml
  phase: implement
  step_id: pick-task
  current_tasks:
    - task_id: "T-1"
      status: in_progress
      iteration: 1
      step: implement
      parallel: false
  ```

  For parallel tasks, list all active tasks in the array:
  ```yaml
  current_tasks:
    - task_id: "T-3"
      status: in_progress
      iteration: 1
      step: implement
      parallel: true
    - task_id: "T-4"
      status: in_progress
      iteration: 1
      step: implement
      parallel: true
  ```

  ## Size Check

  Count non-gate tasks. If 2 or fewer total, set `mode: inline` in state — steps 06-08
  run in the main session without spawning agents. If 3 or more, set `mode: team_loop`.

  ## Task-First Gate

  Never write code that isn't tracked by a task. New subtask discovered:
  1. Stop — create via `TaskCreate` with Why, Files, Verify
  2. Wire blockers via `addBlockedBy`
  3. It will be picked up in the next iteration of this step
