id: execute-tasks
phase: implement
order: 5
description: Execute all pending tasks through the Implementer→Reviewer→Verifier loop, handling parallel tasks and failures

agents: [implementer, reviewer, verifier]

size_threshold:
  small:
    max_non_gate_tasks: 2
    mode: inline
  large:
    min_non_gate_tasks: 3
    mode: team_loop

review:
  score_threshold: 9
  score_dimensions: [correctness, security, simplicity, spec_adherence]
  max_iterations: 3

parallel:
  isolation: worktree
  file_conflict_check: required_before_dispatch
  merge_order: sequential_one_at_a_time
  post_merge_check: pnpm type-check

commit_prefix: "fix:"

skills:
  debugging: systematic-debugging

regression_test_requirement: |
  Phase 2 MUST include a regression test that:
  1. FAILS before the fix is applied (demonstrates the bug is reproduced)
  2. PASSES after the fix is applied (demonstrates the fix works)
  Written BEFORE implementing the fix (red first, then green).
  Remains in the test suite permanently.

fix_minimalism: |
  Fixes must be minimal — address the root cause identified in diagnosis.md only.
  Do NOT refactor surrounding code, add features, or fix unrelated issues.
  Related issues found → add to out-of-scope in fix-plan.md and create separate bug report.

instruction: |
  ## Size Check

  Run `TaskList`. Count non-gate tasks.

  - 2 or fewer: execute inline — implement, self-review, and verify without spawning agents.
  - 3 or more: use the full team loop below.

  ## Task Graph Walk

  Before each iteration, run `TaskList` to identify:
  - Tasks with status "pending" (skip "completed" and "deleted")
  - Which pending tasks are "ready" — all `blockedBy` tasks are "completed"
  - Tasks with `metadata.parallel: true` that are ready and touch different files

  ## Parallel Task Dispatch ([P] tasks)

  Verify each [P] task touches COMPLETELY different files. If any share files, run sequentially.

  For truly parallel [P] tasks:
  1. Dispatch one implementation team per task with `isolation: "worktree"`
  2. Wait for ALL to complete
  3. Merge each worktree branch back ONE AT A TIME
  4. After each merge, run `pnpm type-check`. On failure, spawn `sonnet-agent` to fix.
  5. On merge conflict, spawn `sonnet-agent` to resolve based on commit history intent.

  ## Per-Task Loop

  For each ready, pending task:

  ### 1. Mark Started
  `TaskUpdate(taskId, status: "in_progress")`

  ### 2. Regression Test First (Phase 2 only)
  If this is the regression test task: write the test BEFORE any fix code.
  Confirm it fails against unfixed codebase, then implement the fix, confirm test turns green.
  Red-green proof is required evidence for the Verifier.

  ### 3. Implementer
  Context: task details (Why, Files, Verify), diagnosis, fix-plan, schema mode (bugfix).
  Extra constraints: regression test requirement + fix minimalism rule (see config above).
  Returns: change summary and files modified.

  ### 4. Reviewer
  Context: implementer's changes, diagnosis, fix-plan.
  Extra check: verify fix is minimal (no scope creep, no unrelated refactoring).
  Returns: score 1-10 across configured dimensions, approve/reject.
  - Score >= 9: proceed to verify
  - Score < 9: feed rejection back to implementer (max 3 total iterations)

  ### 5. Verifier
  Context: task's Verify steps, files modified, dev server URL.
  For regression test task: confirm red-before-fix, green-after-fix.
  - Pass: `TaskUpdate(taskId, status: "completed")`
  - Fail: feed back to implementer, re-review, re-verify (max 3 total iterations)

  ### 6. Escalate After 3 Failed Iterations
  `AskUserQuestion` with: task details, all failure summaries, specific blocker.

  ## On ANY Failure (test, build, type error)

  Invoke `systematic-debugging` immediately. Do NOT guess-fix.

  ## Task-First Gate

  Never write code that isn't tracked by a task. New subtask discovered:
  1. Stop coding
  2. `TaskCreate` with Why, Files, Verify
  3. Wire blockers via `addBlockedBy`
  4. Implement through the normal loop

  Exception: trivial one-line fixes (typos, formatting).
