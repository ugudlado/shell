id: final-validation
phase: implement
order: 8
description: Verify all tasks completed and all checks pass before entering the simplify/review pipeline

checks:
  - name: task_completion
    tool: TaskList
    expected: all tasks in `completed` state — zero `pending` or `in_progress`
  - name: test_suite
    command: pnpm test
    evidence: read full output, confirm exit code 0
  - name: build
    command: pnpm build
    evidence: read full output, confirm exit code 0
  - name: git_status
    command: git status
    expected: clean working tree (no uncommitted changes)

tasks_md_sync:
  trigger: after all tasks complete (final sync before PR)
  template: openspec/schemas/<schema>/templates/tasks.md
  target: openspec/changes/$FEATURE_ID/tasks.md
  commit: include in final validation commit
  note: this is the version the local-review UI task parser reads

instruction: |
  ## Step 8: Final Validation

  Before entering the simplify → review → signoff pipeline, confirm that all
  implementation work is complete and the codebase is in a passing state.

  ### 6a. Validate Completion

  1. Run `TaskList` — every task must be `completed`. If any task is still
     `pending` or `in_progress`, do not proceed. Either implement the
     remaining tasks (re-enter step 3) or, if a task should be skipped,
     use `AskUserQuestion` to get approval and then `TaskUpdate` with
     `status: "deleted"`.

  2. Run the full checks in sequence and read every line of output:

     ```bash
     pnpm test
     pnpm build
     git status
     ```

  3. Confirm all three pass with evidence before claiming validation is done:
     - `pnpm test`: all tests green, zero failures
     - `pnpm build`: exits 0, no build errors
     - `git status`: clean working tree — if there are uncommitted changes,
       commit them now with an appropriate message before proceeding

  Do NOT assert "it passes" without running the commands and reading the
  output. Present the evidence (test count, build output, git status) when
  logging completion.

  ### 6b. Final tasks.md Sync

  After all tasks are confirmed completed, do a final sync of tasks.md so it
  reflects the fully-completed state. This is the version that gets committed
  for PR review and is read by the local-review UI task parser.

  Steps:
  1. Run `TaskList` to get all tasks with final statuses
  2. For each task, run `TaskGet` to retrieve full description
  3. Overwrite `openspec/changes/$FEATURE_ID/tasks.md` using the template from
     `openspec/schemas/<schema>/templates/tasks.md`
  4. Commit:
     ```bash
     git add openspec/changes/$FEATURE_ID/tasks.md
     git commit -m "chore: [FEATURE_ID] final tasks.md sync

     Co-Authored-By: Claude <noreply@anthropic.com>"
     ```

  This file is generated, not manually edited. Never modify tasks.md by hand.

  Only after all checks pass AND tasks.md is committed, proceed to
  step 09-simplify.
