id: verifier-signoff
phase: implement
order: 16
description: Verifier runs comprehensive feature-level verification against live server

agent: verifier
dispatch: parallel_with: architect-signoff

instruction: |
  ## Context

  - spec.md acceptance criteria
  - discovery.md use cases (if file exists — every use case must be verified)
  - Running dev server URL
  - Mode: "Feature-level verification — full test suite, build, type-check, end-to-end
    runtime validation of every acceptance criterion. No mocks."

  ## Expected Output

  Per-criterion verification with evidence (test output, curl responses, screenshots).
  Each acceptance criterion: pass or fail with evidence.
  Each use case from discovery: confirmed working end-to-end or gap identified.
