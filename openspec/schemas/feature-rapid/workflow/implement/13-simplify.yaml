id: simplify
phase: implement
order: 13
description: Invoke /simplify on changed files before final review to reduce complexity and surface latent issues

global_iteration_cap:
  steps: 7-8-9  # simplify → review → signoff pipeline
  max_loop_backs: 3
  cap_applies_to: total loop-backs across all three steps combined
  on_cap_exceeded: escalate to user via AskUserQuestion with remaining issues listed

skill: simplify

re_verify_after_simplification:
  commands:
    - pnpm test
    - pnpm build
  purpose: confirm simplification did not break anything

on_new_issues_found:
  action: create tasks via TaskCreate
  metadata:
    phase: "Simplification Fixes"
  then: implement through task loop (step 05-execute-tasks), then re-simplify

autonomy_note: |
  Simplification is a mandatory pre-review step, not optional. Code must be
  simplified before comprehensive review runs. This is part of the autonomous
  pipeline — do not wait for user approval to simplify.

instruction: |
  ## Step 9: Simplify Code

  Before running comprehensive review, simplify the implementation. Simpler
  code is easier to review, easier to maintain, and surfaces latent issues
  that complexity was hiding.

  ### Global Iteration Cap (steps 9-10-11)

  The simplify → review → signoff pipeline can loop back:
  - Review findings create new tasks → re-simplify → re-review
  - Signoff gaps create new tasks → re-simplify → re-review → re-signoff

  Cap the TOTAL number of loop-backs across steps 9, 10, and 11 at 3. Track
  this count. If after 3 loop-backs there are still critical or important
  findings, or signoff gaps remain, use `AskUserQuestion` to present the
  remaining issues and ask for direction. Do not continue looping silently.

  ### Invoke /simplify

  Invoke the `/simplify` skill on the files changed during implementation.
  Provide the list of modified files from `git diff main...HEAD --name-only`.

  The simplify skill will reduce complexity, eliminate dead code, flatten
  unnecessary abstractions, and improve readability without changing behavior.

  ### Re-Verify After Simplification

  If simplification makes any changes to the codebase, re-run verification
  to confirm nothing broke:

  ```bash
  pnpm test
  pnpm build
  ```

  Read the output. If tests fail or build breaks after simplification, treat
  this as a bug introduced by simplification — fix it before proceeding. Use
  `systematic-debugging` skill if the root cause is not immediately obvious.

  ### Handle New Issues Found During Simplification

  If simplification reveals issues that need real implementation work (not
  just cleanup), create tasks for them:

  ```
  TaskCreate:
    subject: "T-N: [issue description]"
    description: |
      **Why**: [what simplification revealed]
      **Files**: [files to modify]
      **Verify**: [concrete criteria]
    metadata:
      phase: "Simplification Fixes"
  ```

  Implement those tasks through the full Implementer → Reviewer → Verifier
  loop (step 05-execute-tasks). Then re-invoke `/simplify` on the new changes
  before proceeding to final review. This counts as one loop-back toward the
  cap of 3.

  After simplification is clean and all checks pass, proceed to
  step 10-final-review.
