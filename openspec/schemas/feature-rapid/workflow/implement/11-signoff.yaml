id: signoff
phase: implement
order: 11
description: Architect + Verifier parallel signoff — terminal quality gate before presenting to user

agents: [architect, verifier]
dispatch: parallel

max_signoff_rounds: 2

on_gaps_found:
  action: create tasks via TaskCreate
  metadata:
    phase: "Signoff Fixes"
  then: re-enter task loop → simplify → final review → signoff
  counts_toward: global loop-back cap (max 3 total)
  on_cap_exceeded: escalate to user via AskUserQuestion

signoff_clean_gate:
  all_must_pass:
    - phase-review score >= 9/10
    - zero critical findings
    - zero important findings (or explicitly accepted by user)
    - security audit clean
    - runtime verification passed — all acceptance criteria validated against live server
    - all tests pass, build succeeds, types check
    - architect confirms spec compliance
    - verifier confirms all acceptance criteria met with runtime evidence

instruction: |
  ## Terminal Quality Gate

  After simplification and all reviews pass, run signoff. No implementation
  steps follow a clean signoff — only reporting.

  ### Architect Context
  - Full spec.md and design.md content
  - Complete git diff (`git diff main...HEAD`)
  - Mode: "Signoff — review for gaps, spec drift, over-engineering, missing requirements"

  ### Verifier Context
  - spec.md acceptance criteria
  - discovery.md use cases (if file exists — every use case must be verified)
  - Running dev server URL
  - Mode: "Feature-level verification — full test suite, build, type-check, end-to-end
    runtime validation of every acceptance criterion against the live server. No mocks."

  Collect both agents' findings before deciding next action.

  ### If Gaps Are Found

  1. Architect generates new tasks (Why, Files, Verify) for each gap.
     Create via TaskCreate with `metadata: {"phase": "Signoff Fixes"}`.
  2. Re-enter task loop for new tasks
  3. Re-run simplify on changed files
  4. Re-run final review
  5. Re-run signoff (counts toward global loop-back cap)

  After 2 signoff rounds with remaining gaps, escalate to user via AskUserQuestion.

  ### If Clean — Present to User

  Only present when all `signoff_clean_gate` criteria pass.

  Use `AskUserQuestion` to present:
  - Final Review Report (per-reviewer scores and findings)
  - Signoff summary from both agents
  - Summary of all commits
  - Ask user to approve before marking ready for `/complete-feature`

  Do not run `/complete-feature` without explicit user approval.
