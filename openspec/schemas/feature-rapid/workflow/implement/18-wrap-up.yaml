id: wrap-up
phase: implement
order: 18
description: Stop dev server, classify review findings, store learnings, update Linear, output final report

tools:
  - mcp__plugin_claude-mem_mcp-search__search  # write auto memory files
  - mcp__plugin_linear_linear__save_issue       # update Linear ticket status

skills: []  # no skill invocations — all steps are direct actions

finding_categories:
  spec_gap:
    definition: spec should have required this but didn't
    example: "No error handling for malformed input — spec never mentioned input validation"
    action: save as Architect feedback memory
    memory_type: feedback
  design_gap:
    definition: design approach caused issues found in review
    example: "Component tree too deep, causing re-render perf issues — design chose wrong structure"
    action: save as design pattern feedback
    memory_type: feedback
  implementation_gap:
    definition: spec covered this but implementer missed it
    example: "Spec said validate input but handler has no validation"
    action: no feedback needed — implementation error, not a spec/design flaw
  scope_gap:
    definition: feature fundamentally needed something the spec couldn't have anticipated
    example: "3rd-party API changed behavior since spec was written"
    action: note for awareness only

memory_files:
  feedback:
    naming: "feedback_[FEATURE_ID]_[topic].md"
    content_fields:
      - what was missed
      - what the spec/design should have included
      - which review caught it
      - "Why:" line
      - "How to apply:" line
    example: |
      "Specs for data I/O features must include error handling requirements for malformed
       input — missed in [FEATURE_ID], caught by silent-failure-hunter in final review"
    loaded_by: /specify step 2 (memory search) — Architect avoids same gaps in future specs

  project:
    naming: "project_[FEATURE_ID]_[topic].md"
    content_fields:
      - implementation patterns discovered
      - problems solved and approaches used
      - reusable insights

linear:
  condition: Linear ticket ID present in .openspec.yaml
  tool: mcp__plugin_linear_linear__save_issue
  status: "In Review"
  include: implementation summary

report_sections:
  - task summary (count of completed / skipped / total from tasks.md)
  - commits created (list with messages)
  - test results (TDD mode — include coverage number)
  - final review scores (per-reviewer + aggregate)
  - any blockers or open notes

stop_dev_server:
  timing: after signoff complete OR when escalating to user
  method: |
    PID_FILE=$(ls /tmp/claude-dev-servers/*.pid 2>/dev/null | head -1)
    if [ -f "$PID_FILE" ]; then
      kill $(head -1 "$PID_FILE")
    fi
  note: the process-kill-guard hook allows killing only the registered dev server PID

instruction: |
  ## Step 12: Wrap-Up

  Run all four wrap-up actions after signoff. These are independent and can
  be done in parallel except where noted.

  ### 9b. Stop Dev Server

  Kill the dev server that was started in step 2b. The process-kill-guard
  hook allows killing the registered PID. Do not try to kill by port or by
  process name — use the PID file:

  ```bash
  PID_FILE=$(ls /tmp/claude-dev-servers/*.pid 2>/dev/null | head -1)
  if [ -f "$PID_FILE" ]; then
    kill $(head -1 "$PID_FILE")
  fi
  ```

  Stop the server after signoff is complete, or if you are escalating to the
  user (so a stale server doesn't accumulate across sessions).

  ### 10a. Classify Review Findings

  Before storing learnings, classify every critical and important finding from
  step 14 (final review) into one of four categories:

  | Category | Definition |
  |----------|-----------|
  | Spec gap | Spec should have required this but didn't |
  | Design gap | Design approach caused the issue |
  | Implementation gap | Spec covered this, implementer missed it |
  | Scope gap | Couldn't have been anticipated at spec time |

  For each **spec gap** and **design gap**, save a feedback auto memory file:
  - Type: `feedback`
  - File name: `feedback_[FEATURE_ID]_[topic].md`
  - Content must include:
    - What was missed
    - What the spec/design should have included
    - Which review caught it
    - A "Why:" line explaining the pattern
    - A "How to apply:" line explaining how future specs should differ

  Example: *"Specs for data I/O features must include error handling
  requirements for malformed input — missed in HL-42, caught by
  silent-failure-hunter in final review. Why: data mutation endpoints without
  input validation create silent failures. How to apply: every spec for write
  endpoints must include an error handling section listing expected 4xx
  responses."*

  These memory files are loaded during `/specify` step 2 (memory search) so
  the Architect avoids repeating the same spec/design gap.

  **Implementation gaps** need no feedback memory — they are implementer
  errors, not spec/design flaws.

  ### 10b. Store Implementation Learnings

  Save implementation learnings as auto memory files:
  - Type: `project`
  - File name: `project_[FEATURE_ID]_[topic].md`
  - Content: implementation patterns discovered, problems solved and how,
    reusable insights specific to this codebase or stack

  Only store learnings that would genuinely help future implementation sessions.
  Don't store obvious or generic observations.

  ### 11. Update Linear (if applicable)

  If a Linear ticket ID is present in `.openspec.yaml`, update the ticket:

  ```
  mcp__plugin_linear_linear__save_issue:
    issueId: [ticket ID from .openspec.yaml]
    status: "In Review"
    comment: [brief implementation summary — tasks completed, key decisions,
              test coverage if TDD, any advisory findings]
  ```

  Skip this step if no Linear ticket is present.

  ### 12. Output Final Report

  Output a structured summary to the user:

  1. **Task Summary**: Total tasks, completed count, skipped count. Pull from
     tasks.md for the formatted list.

  2. **Commits Created**: List all commits made during this session with their
     messages (run `git log main...HEAD --oneline`).

  3. **Test Results** (TDD mode only): Test count, pass/fail, coverage
     percentage. Quote the actual test runner output.

  4. **Final Review Scores**: Per-reviewer score and top findings, plus the
     aggregate score. Note any advisory findings for the user's awareness.

  5. **Next Step**: Remind the user to run `/complete-feature [FEATURE_ID]`
     to merge and clean up.

  ## Autonomy Guidelines (applies throughout all steps)

  Run the full pipeline autonomously — implement all phases, run all reviews,
  fix all findings, verify everything — then present the finished, fully-
  verified feature to the user.

  **Only pause for user input when:**
  - A task has `[NEEDS CLARIFICATION]` in the spec
  - Review score < 9/10 after 3 iterations of fixes
  - Merge conflict that sonnet-agent cannot resolve from commit history context
  - Test failure that systematic-debugging cannot resolve after 2 attempts
  - Security audit reveals a design-level concern (not just a code fix)

  **Never start untracked work:**
  - Every code change must map to a task (verified via TaskList)
  - If work doesn't have a task, create one via TaskCreate first — then implement
  - The only exception: trivial one-line fixes (typos, formatting)

  **Always use AskUserQuestion to pause for user approval on:**
  - Skipping a task (mark deleted with reason)
  - Final signoff (after ALL quality gates pass — present the complete review report)

  **Parallel fix dispatch:**
  - When multiple reviewers flag issues, dispatch parallel subagents simultaneously
  - Each subagent gets one reviewer's findings + the relevant files
  - After all subagents complete, re-verify holistically before re-running reviews

  ## Quality Standards Reference

  | Schema | Tests | Coverage | Review Score | Final Review Scenario |
  |--------|-------|----------|--------------|----------------------|
  | feature-tdd | Before impl (TDD) | >= 90% | >= 9/10 | A/B/C by scope + test-analyzer |
  | feature-rapid | Optional | N/A | >= 9/10 | A/B/C by scope |
  | bugfix | Regression test required | N/A | >= 9/10 | Scenario D |

  Staff Engineer Bar: no feature is presented to the user until ALL applicable
  reviews pass with zero critical/important findings. The feedback loop in
  steps 14 and 17 iterates autonomously until the bar is met or escalation
  is needed. Signoff (step 17) is the terminal gate — nothing follows it
  except this wrap-up step.
