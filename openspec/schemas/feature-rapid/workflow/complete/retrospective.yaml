id: retrospective
phase: complete
order: 4
description: Compare spec predictions against actuals and write telemetry

# Structured config
executor: haiku-agent
must_run_before_worktree_removal: true

metrics:
  spec_accuracy:
    predicted_files: count from design.md "Files to Create/Modify" section
    actual_files: git diff --stat main...HEAD --name-only
    hit_rate: (predicted ∩ actual) / actual
    noise_rate: (predicted - actual) / predicted
    surprise_files: actual - predicted
  task_granularity:
    categories:
      planned: "Phase 1, Phase 2, etc."
      review_fixes: "Review Fixes"
      signoff_fixes: "Signoff Fixes"
      simplification_fixes: "Simplification Fixes"
      verification_bugs: tasks created during phase verification
      user_requests: "User Request"
    unplanned_ratio: (review_fixes + signoff_fixes + simplification_fixes + verification_bugs) / (planned + unplanned)
  telemetry_file: ~/.claude/logs/feature-metrics.jsonl

thresholds:
  feedback_save_threshold: unplanned_ratio > 0.2
  feedback_memory_type: feedback
  feedback_name_pattern: "feedback_[FEATURE_ID]_spec_retrospective.md"

instruction: |
  Run BEFORE worktree removal — this step needs `git diff` from within the worktree.

  **4a. Spec accuracy — predicted vs actual files:**

  ```bash
  cd "$WORKTREE"
  git diff --stat main...HEAD --name-only > /tmp/actual-files.txt
  ```

  Read the spec's `design.md` "Files to Create/Modify" section and compare against
  actual files changed.

  Compute:
  - **Predicted files**: files listed in design.md
  - **Actual files**: files from `git diff --stat`
  - **Hit rate**: (predicted ∩ actual) / actual — what % of actual changes did the
    spec predict?
  - **Noise rate**: (predicted - actual) / predicted — what % of spec predictions
    were unnecessary?
  - **Surprise files**: actual - predicted — files that needed changes but weren't
    in the spec

  **4b. Task granularity — planned vs unplanned work:**

  Run `TaskList` and categorize all tasks by their `metadata.phase`:

  | Category              | Phase values                    | Meaning                                     |
  |-----------------------|---------------------------------|---------------------------------------------|
  | Planned               | Phase 1, Phase 2, etc.          | Original tasks from /specify                |
  | Review fixes          | Review Fixes                    | Issues caught by final review               |
  | Signoff fixes         | Signoff Fixes                   | Gaps found during architect/verifier signoff |
  | Simplification fixes  | Simplification Fixes            | Issues found during code cleanup            |
  | Verification bugs     | tasks created during verify     | Broken assumptions in verify steps          |
  | User requests         | User Request                    | Scope additions by user mid-implementation  |

  Count tasks in each category. Compute:
  - **Planned tasks**: count of Phase N tasks
  - **Unplanned tasks**: review fixes + signoff fixes + simplification fixes +
    verification bugs (excludes user requests — those aren't quality signals)
  - **Unplanned ratio**: unplanned / (planned + unplanned) — lower is better
  - **Top unplanned source**: which category contributed most unplanned tasks

  **4c. Write telemetry:**

  ```bash
  mkdir -p ~/.claude/logs
  ```

  Append one JSON line to `~/.claude/logs/feature-metrics.jsonl`:

  ```json
  {
    "featureId": "FEATURE_ID",
    "schema": "feature-tdd|feature-rapid|bugfix",
    "completedAt": "ISO timestamp",
    "tasks": {
      "planned": N,
      "reviewFixes": N,
      "signoffFixes": N,
      "simplificationFixes": N,
      "verificationBugs": N,
      "userRequests": N,
      "skipped": N,
      "total": N
    },
    "unplannedRatio": 0.XX,
    "specAccuracy": {
      "predictedFiles": N,
      "actualFiles": N,
      "hitRate": 0.XX,
      "noiseRate": 0.XX,
      "surpriseFiles": ["file1.ts", "file2.ts"]
    },
    "reviewIterations": N,
    "signoffRounds": N
  }
  ```

  **4d. Save spec-gap feedback (if unplanned ratio > 0.2):**

  If unplanned ratio exceeds 20%, analyze the unplanned tasks to identify patterns:
  - Are they concentrated in one area (e.g., all error handling)?
  - Do they share a common root cause (e.g., spec didn't consider edge cases)?

  Save a feedback auto memory file (type: `feedback`) named
  `feedback_[FEATURE_ID]_spec_retrospective.md`:
  - Content: what types of tasks were missed, and what `/specify` should include
    next time
  - Include **Why:** and **How to apply:** lines
  - Only save if the pattern is non-obvious and actionable
