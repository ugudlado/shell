id: create-ticket
phase: specify
order: 3
description: Create Linear ticket early using feature description, extract ticket ID for use in identifier

skip_when: no_linear == true

tools:
  - mcp__plugin_linear_linear__save_issue

linear:
  team_name: Home Labs
  team_id: 80452c36-1579-49d6-9e6e-59afbb82bce5
  ticket_prefix: HL
  project_id: 99ec4b7c-2ab3-41b3-9924-4499952b4228  # "Tickets" project
  update_after_artifacts: true   # store-commit-report updates description with spec links

instruction: |
  ## Check Skip Condition

  If `NO_LINEAR` is true (flag `--no-linear` was passed in `parse-args`), skip this entire step.
  Record `LINEAR_ID = null` and continue to `discovery`.

  ## Create Linear Ticket

  **Read label config**: Read `.claude/memory/linear-config.md` from the project root to get `label_ids`.
  If the file doesn't exist, proceed without labels.

  Call `mcp__plugin_linear_linear__save_issue` with:
  - `title`: a concise feature title derived from FEATURE_DESC (10 words or fewer)
  - `description`: the full FEATURE_DESC text (this will be updated later in `store-commit-report` with spec links)
  - `teamId`: 80452c36-1579-49d6-9e6e-59afbb82bce5
  - `labelIds`: from `.claude/memory/linear-config.md` (if available)
  - `projectId`: 99ec4b7c-2ab3-41b3-9924-4499952b4228

  ## Extract Linear ID

  From the response, extract the issue identifier — format is `HL-NNN` (e.g., `HL-80`).

  Store this as `LINEAR_ID`.

  ## Carry Forward

  `LINEAR_ID` is used in:
  - `generate-id-worktree`: `[LINEAR_ID]-[slug]`
  - `generate-artifacts`: written to `.openspec.yaml` as `linear-ticket`
  - `store-commit-report`: description updated with artifact links
