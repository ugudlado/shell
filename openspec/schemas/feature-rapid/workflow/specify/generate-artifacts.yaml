id: generate-artifacts
phase: specify
order: 8
description: Scaffold change directory, write .openspec.yaml and discovery.md, then let Architect generate spec and design

openspec_cli:
  scaffold_command: "openspec new change $FEATURE_ID"
  creates: "$OPENSPEC_CHANGES_DIR/$FEATURE_ID/"
  instructions_command: "openspec instructions <artifact-id> --change $FEATURE_ID --json"
  status_command: "openspec status --change $FEATURE_ID --json"

artifact_order:
  feature-tdd:   [discovery, spec, design]
  feature-rapid: [discovery, spec, design]
  bugfix:        [diagnosis, fix-plan]

openspec_yaml_template:
  schema: "<SCHEMA>"           # feature-tdd | feature-rapid | bugfix
  feature-id: "<FEATURE_ID>"
  linear-ticket: "<HL-NNN or none>"
  worktree: "~/code/feature_worktrees/<FEATURE_ID>"
  branch: "feature/<FEATURE_ID>"

traceability:
  requirement: Every use case in discovery.md must map to at least one acceptance criterion
  format: "[traces: UC-N]"
  appended_to: each acceptance criterion in spec.md

artifact_ownership:
  discovery_md: main_session   # written directly from approved Discovery Brief
  openspec_yaml: main_session  # written directly from known values
  spec_md: architect_agent
  design_md: architect_agent
  diagnosis_md: architect_agent   # bugfix only
  fix_plan_md: architect_agent    # bugfix only

instruction: |
  ## Scaffold Change Directory

  From within WORKTREE_PATH, run:
  ```bash
  cd "$WORKTREE_PATH"
  openspec new change "$FEATURE_ID"
  ```

  This creates `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/` with a starter `.openspec.yaml`.

  ## Write .openspec.yaml

  Overwrite `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/.openspec.yaml` with per-change metadata:
  ```yaml
  schema: <SCHEMA>
  feature-id: <FEATURE_ID>
  linear-ticket: <LINEAR_ID or "none">
  worktree: ~/code/feature_worktrees/<FEATURE_ID>
  branch: feature/<FEATURE_ID>
  ```

  Fill in all values from prior steps.

  ## Write discovery.md (feature schemas only)

  For feature-tdd and feature-rapid schemas, write the approved Discovery Brief from `discovery-gate`
  to `$OPENSPEC_CHANGES_DIR/$FEATURE_ID/discovery.md`.

  Use the exact content from the approved brief (personas, use cases with UC-N IDs, scope,
  UI direction, key decisions, open questions). Do not paraphrase or abbreviate.

  For bugfix schema, skip this file.

  ## Architect Generates Remaining Artifacts

  Instruct the Architect agent (from `design`) to generate remaining artifacts in dependency order.

  For each artifact the Architect must produce:

  1. Get instructions:
     ```bash
     openspec instructions <artifact-id> --change "$FEATURE_ID" --json
     ```
  2. Read the template, context files, and rules from the instructions output.
  3. Delegate additional research to Researcher via SendMessage if needed.
  4. Create the artifact file using research findings + Discovery Brief + schema rules.
  5. Check status:
     ```bash
     openspec status --change "$FEATURE_ID" --json
     ```
  6. Continue until all `applyRequires` artifacts are DONE.

  **Traceability requirement**: The Architect MUST map every use case from discovery.md to at
  least one acceptance criterion in spec.md. Append `[traces: UC-N]` to each criterion line.

  **Tasks are NOT generated here.** tasks.md is deferred to `/implement`.

  ## Verify

  After all artifacts are written, run:
  ```bash
  openspec status --change "$FEATURE_ID" --json
  ```
  Confirm all expected artifacts (per schema) show status DONE before proceeding.
