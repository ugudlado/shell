id: user-review
phase: specify
order: 11
description: Present all artifacts to the user for approval; wait for confirmation or incorporate feedback

tools:
  - AskUserQuestion

artifacts_to_present:
  - openspec/changes/$FEATURE_ID/discovery.md
  - openspec/changes/$FEATURE_ID/spec.md
  - openspec/changes/$FEATURE_ID/design.md

instruction: |
  ## Present Artifacts

  Use `AskUserQuestion` to present the complete set of generated artifacts. Summarize the key
  points of each artifact inline so the user can review without opening files:

  - **discovery.md**: personas, use cases (list all UC-N / UC-EN), scope summary
  - **spec.md**: acceptance criteria list, review summary
  - **design.md**: high-level design decisions, key trade-offs

  Ask the user to:
  - Approve and proceed to commit, or
  - Request specific changes to artifacts, or
  - Adjust scope (add/remove use cases, change in/out-of-scope)

  Wait for their response before proceeding.

  ## Incorporate Feedback

  If the user requests changes:
  1. Update the relevant artifact files directly.
  2. If changes are significant (new use cases, scope shifts, architectural pivots), re-run the
     affected subset of reviews from step 10 before re-presenting.
  3. Re-present updated artifacts via AskUserQuestion.

  There is no hard limit on feedback rounds here — continue until the user explicitly approves.

  ## On Approval

  User has confirmed the artifacts. Proceed to step 12.
