id: search-memory
phase: specify
order: 2
description: Search claude-mem for relevant patterns and past decisions before any codebase work

tools:
  - mcp__plugin_claude-mem_mcp-search__search

instruction: |
  ## Search Memory

  Call `mcp__plugin_claude-mem_mcp-search__search` before doing any other work.

  Search for terms derived from the feature description (from step 01-parse-args):
  - Key nouns from FEATURE_DESC (e.g., "auth", "payment", "dashboard")
  - Technical terms that appear in the description
  - Any Linear ticket ID if known at this point

  ## Collect and Note Results

  Read the search results and note:
  - Prior architectural decisions relevant to this feature
  - Patterns or conventions already established in the codebase
  - Libraries or approaches that were chosen (or deliberately rejected) in past work
  - Feedback memories that might affect design choices

  ## Carry Forward

  These memory results are passed as context to:
  - Step 04-discovery (informs codebase exploration focus)
  - Step 06-create-agents (fed to both Researcher and Architect as prior decisions)
  - Step 08-generate-artifacts (Architect uses them when grounding design choices)

  Do not skip this step even if memory results are empty — the empty result itself is useful signal.
