# GitAgent-style manifest for this repository (documentation; not consumed by Claude/Cursor natively).
# See https://github.com/open-gitagent/gitagent for upstream conventions.

name: shell-dotfiles
version: "1"
description: >
  Dotfiles and AI tooling repo — GNU Stow home config, Claude Code under src/claude/,
  Spec workflow definitions, Cursor guidance via AGENTS.md and .cursor/rules.

identity:
  soul: SOUL.md
  rules: RULES.md
  duties: DUTIES.md
  agents_fallback: AGENTS.md

capabilities:
