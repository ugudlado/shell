# Linear Issue Tracking Configuration
# Symlinked to ~/.config/linear/config.yaml by configure_linear() in setup-common.sh
# Read by Spec schema step files (create-ticket.yaml) at runtime.

team:
  name: Home Labs
  id: 80452c36-1579-49d6-9e6e-59afbb82bce5
  prefix: HL
  project_id: 99ec4b7c-2ab3-41b3-9924-4499952b4228  # "Tickets" project

# Each repo is keyed by its directory name (basename of repo root).
# If a repo is not listed here, Linear integration is disabled (--no-linear).
repos:
  shell:
    label_ids:
      - a1948a92-9028-4671-8f70-ae7b8a7120a1  # shell (product label)
  algoviz:
    label_ids:
      - a116a1a4-7384-42f8-bec5-c32c21ebd743  # algoviz (product label)
  paperlens:
    label_ids:
      - 3ceb1667-9a3d-4a6d-90e2-2741bac08879  # paperlens (product label)
  hooksmith:
    label_ids:
      - 242016b3-5de8-4758-b2de-ae15a842ff49  # hooksmith (product label)
  youtubetv:
    label_ids:
      - 4dfffff0-8e45-4936-950b-e848c59c6c56  # youtubetv (product label)
  resolvr:
    label_ids:
      - 984c3268-30c3-4d1a-98e1-d3db0873054b  # resolvr (product label)
  valet:
    label_ids:
      - 378a819f-b538-4b92-906e-d27a8b60e2fe  # valet (product label)
  algotrade:
    label_ids:
      - 6444207e-a430-4dd8-b28c-095b8ccaece0  # algotrade (product label)

# Required labels on every new ticket:
#   Product: repo name (e.g. "shell") — UUID from repos.<name>.label_ids
#   Type: Feature | Bug | Improvement | Chore | Research
#   Complexity: XS | S | M | L
#
# To add a new repo:
#   1. Create a product label in Linear for the repo
#   2. Add an entry under repos: above with the label UUID
#   3. Run /bootstrap in the repo to verify
