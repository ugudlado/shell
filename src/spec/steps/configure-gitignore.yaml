id: configure-gitignore
version: 1

intent: Ensure .gitignore has language-appropriate entries. Never remove existing entries.

inputs:
  - detect-language outputs (languages)
  - Existing .gitignore (may not exist)

rules:
  - Only append missing entries. Never remove or reorder existing lines.
  - Always include .tooling-state.json.

instruction: |
  1. Read existing `.gitignore` (or create empty if missing).
  2. Always add if missing: `.tooling-state.json`
  3. Per detected language, append missing entries:

     | Language | Required entries |
     |----------|-----------------|
     | Node/TS  | node_modules/, dist/, coverage/, .env, .env.local, .env*.local |
     | Python   | __pycache__/, *.pyc, .venv/, .mypy_cache/, .ruff_cache/, htmlcov/, .coverage, dist/, *.egg-info/ |
     | Rust     | target/ |
     | Go       | bin/ |

  4. Write updated .gitignore.

verify:
  - .gitignore exists
  - .tooling-state.json is in .gitignore
  - Language-specific entries present

outputs:
  - entries_added: list of new gitignore entries
