id: run-phase-review
version: 1

intent: Run phase quality checks and decide pass/retry.

inputs:
  - task_execution_result
  - phase_context_bundle

rules:
  - Enforce minimum review score from project quality_bar.
  - Capture concrete findings with fix direction.
  - Keep retries within configured max_retry_rounds.

instruction: |
  1. Run the phase's verify.commands (from schema) if present:
     Execute each command. All must exit 0.
  2. Check the phase's verify.assertions (from schema):
     Evaluate each assertion. All must be true.
  3. Check the phase's verify.metrics (from schema):
     Compare actual values against thresholds.
     Apply `when:` conditions on metrics (e.g., test_coverage only when tdd_required).
  4. Score the phase 1-10:
     - Critical finding (unmet assertion) → caps score at 5
     - Important finding (command failure) → caps score at 7
     - All green → score based on quality of output
  5. If score >= phase verify.metrics.review_score.min and no critical findings: PASS.
     Record score in state.yaml and proceed.
  6. If FAIL:
     a. Generate targeted fix tasks for each finding with evidence.
     b. Increment retry counter in state.yaml.
     c. If retries >= phase verify.max_retries: execute on_max_retries action.
     d. Otherwise: execute fix tasks, then re-run this review step.

verify:
  - Review score recorded in state.yaml under step_history as {step_id: run-phase-review, phase: <current>, status: completed, review_score: <N>}
  - All critical findings have either a fix task or are resolved
  - phase-signoff will BLOCK if this step's entry is missing from step_history — this step is not optional

outputs:
  - phase_review_report
