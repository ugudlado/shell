id: setup-claude-md
version: 6

intent: Create CLAUDE.md and AGENTS.md as pointers to spec/project.yaml.

inputs:
  - Existing CLAUDE.md (may not exist)
  - Existing AGENTS.md (may not exist)

rules:
  - CLAUDE.md and AGENTS.md are pure pointers — one line directing agents to read project.yaml.
  - All project context (vision, architecture, rules, learnings) lives in spec/project.yaml.
  - If either file exists and already points to project.yaml, skip it.

instruction: |
  1. If CLAUDE.md does not exist, create it:
     ```markdown
     # CLAUDE.md

     Read `spec/project.yaml` for all project context — vision, architecture, tech stack, quality bars, rules, gotchas, and learnings.
     ```

  2. If AGENTS.md does not exist, create it:
     ```markdown
     # AGENTS.md

     Read `spec/project.yaml` for all project context — vision, architecture, tech stack, quality bars, rules, gotchas, and learnings.
     ```

  3. If either file already exists, log:
     `[bootstrap] CLAUDE.md/AGENTS.md already exists — skipping`

verify:
  - CLAUDE.md exists at project root
  - AGENTS.md exists at project root
  - Both files point to spec/project.yaml

outputs:
  - claude_md_created: boolean
  - agents_md_created: boolean
