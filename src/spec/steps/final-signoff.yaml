id: final-signoff
version: 2

intent: Collect the final user approval before archive.

inputs:
  - final_verification_report

flags_read:
  - name: auto
    effect: "Auto-approve without user interaction and log to state.yaml"

rules:
  - Surface unresolved risks before asking for signoff.
  - On rejection, route back to implement fixes.

instruction: |
  SKIP CONDITIONS:
  - If auto flag is true:
    a. Check that run-feature-verification completed (step_history entry exists).
    b. Read the verification report for unresolved_risks or critical findings.
    c. If NO critical/high unresolved risks → auto-approve and log to state.yaml
       (field: approval with type: auto).
    d. If critical/high unresolved risks exist → pause and present risks to user
       even with auto flag. Safety overrides autonomy.

  1. Present the final verification report to the user:
     - Summary of what was built/fixed
     - Per-criterion verification results with evidence
     - Quality gate results (type-check, test, build)
     - Any unresolved risks or known limitations
  2. Ask for explicit final approval to archive and close.
  3. If approved: record approval in state.yaml (field: approval), proceed to archive.
  4. If rejected: record rejection in state.yaml (field: rejection),
     route back to implement phase for additional fixes. Do NOT archive.

verify:
  - User approval (or auto-approval) recorded in state.yaml

outputs:
  - final_signoff_decision
