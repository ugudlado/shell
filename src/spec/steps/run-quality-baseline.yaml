id: run-quality-baseline
version: 1

intent: Run all quality gates, auto-fix where possible, establish passing baseline.

inputs:
  - project context (verify_commands, context.tech_stack from project.yaml)
  - install-tooling outputs (tools_installed, scripts_added)

rules:
  - Auto-fix first, then verify.
  - If a gate fails with non-fixable issues, log them but continue.
  - All gates should pass after this step.

instruction: |
  0. Read `verify_commands` from project.yaml (loaded by load-project-context).
     Use these as the canonical list of quality gates to run.
     Fall back to install-tooling outputs if project.yaml is not yet available.

  1. **Auto-fix pass** — run fixers for each detected language:
     - Node/TS: `pnpm lint --fix`, `pnpm format`
     - Python: `ruff check --fix .`, `ruff format .`
     - Rust: `cargo fmt`
     - Go: `gofumpt -w .`

  2. **Verification pass** — run each quality gate:
     - lint, format:check, type-check, dead-code (knip), test
     - For each: record pass/fail

  3. **Report baseline**:
     ```
     [bootstrap] Quality gate baseline:
       Lint: ✓/✗ | Format: ✓/✗ | Type check: ✓/✗ | Dead code: ✓/✗ | Tests: ✓/✗
     ```

  4. If any gate fails after auto-fix, note it as a known issue but do NOT block.

verify:
  - All quality gates executed
  - Results logged (pass/fail per gate)
  - Auto-fix pass completed before verification

outputs:
  - gate_results: map of gate_name → pass/fail
  - auto_fixes_applied: boolean
