id: run-feature-verification
version: 2

intent: Validate final change behavior against acceptance criteria.

agent: reviewer

inputs:
  - phase_context_bundle
  - completed_tasks
  - spec.md (feature/chore) or fix-plan.md (bugfix)

rules:
  - Verify every acceptance criterion with evidence.
  - Ensure build/test/type-check gates are green per schema.
  - Convert verification failures into actionable fixes.
  - For FIXED/RESOLVED/COMPLETE claims: re-run the original search against the ENTIRE source tree from scratch. Do not trust earlier phase counts.

instruction: |
  1. Read spec.md (feature) or fix-plan.md (bugfix) for acceptance criteria,
     using the format defined in CONVENTIONS.md § Specification Format Contract
     or § Fix Plan Format Contract respectively.
  2. For each acceptance criterion:
     a. Run the verification check (test, manual check, or build gate).
     b. Record pass/fail with evidence (command output, screenshot, etc.).
     c. If a criterion uses ALL/EVERY/EACH:
        - Define scope: what "all" means for this criterion (e.g., "all .ts files in src/").
        - Count programmatically: use grep/find/ast to get the total N.
        - Verify each target with evidence.
        - Report: "Verified N/N <target type>" (e.g., "Verified 47/47 API routes").
        - If N differs from any earlier count in spec: note the discrepancy and
          use the fresh count as authoritative.
  3. Run full project quality gates:
     - type-check (if project supports it)
     - test suite (full run, not just changed tests)
     - build (if project supports it)
  4. Produce a verification report with:
     - Per-criterion pass/fail with evidence
     - Quality gate results
     - Any unresolved issues
  5. If all pass: proceed to final-signoff.
     If any fail: route back to implement phase for fixes.
  6. Update state.yaml step_history per CONVENTIONS.md § State Updates.

verify:
  - Every acceptance criterion has pass/fail with evidence
  - Criteria using ALL/EVERY/EACH have exhaustive count: "Verified N/N"
  - FIXED/RESOLVED claims verified by fresh search of entire source tree, not earlier counts
  - All phase verify.commands pass (exit 0)
  - Verification report written to state.yaml

outputs:
  - final_verification_report
