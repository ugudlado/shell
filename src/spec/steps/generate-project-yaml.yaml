id: generate-project-yaml
version: 4

intent: Create spec/project.yaml by selecting a stack template and customizing with user.

inputs:
  - detect-language outputs (languages, package_manager, web_project, backend_project)
  - install-tooling outputs (scripts_added)
  - Templates: $SPEC_HOME/templates/bootstrap/project-yaml/

rules:
  - If spec/project.yaml already exists, skip entirely — never overwrite.
  - Use stack templates as the starting point — do not assemble from scratch.
  - Detection suggests the template; user confirms the choice.
  - Only include verify commands for tools that were actually installed.

instruction: |
  1. Check if `$REPO_ROOT/spec/project.yaml` exists. If yes, log:
     `[bootstrap] spec/project.yaml already exists — skipping generation`
     and return immediately.

  2. List available templates from `$SPEC_HOME/templates/bootstrap/project-yaml/`:

     | Template | Stack | verify_commands |
     |----------|-------|-----------------|
     | `node-ts` | TypeScript + Node | `[type-check, test, lint, format:check, knip]` |
     | `node-js` | JavaScript + Node | `[test, lint, format:check, knip]` |
     | `python` | Python | `[test, lint]` |
     | `rust` | Rust | `[test, clippy]` |
     | `go` | Go | `[test, vet]` |
     | `shell` | Bash/Zsh/Config | `[]` |

  3. Use detect-language output to suggest a template:
     - `node-ts` → suggest `node-ts`
     - `node` → suggest `node-js`
     - `python` → suggest `python`
     - `rust` → suggest `rust`
     - `go` → suggest `go`
     - No indicator files → suggest `shell`

  4. Present the suggestion to the user:
     ```
     Based on detection, I'd suggest the **<template>** project template.

     Available templates: node-ts, node-js, python, rust, go, shell

     Which template would you like to use? (or press enter for <template>)
     ```

  5. Read the selected template from
     `$SPEC_HOME/templates/bootstrap/project-yaml/<selection>.yaml`.

  6. Fill in project-specific fields:
     - `project.name` — basename of $REPO_ROOT
     - `project.repo` — same (or org/repo if known)
     - `project.summary` — from package.json/pyproject.toml description, or ask user
     - `context.tech_stack` — adjust based on actual detection:
       - Append package_manager if different from template default
       - If web_project, append `web`
       - If frameworks detected (react, next, django, etc.), append them
     - `verify_commands` — filter to only commands with installed scripts

     If `web_project`, add to conventions: `UI changes require /critique review.`

  7. Present the filled template to the user for review:
     ```
     Here's your project.yaml based on the <template> template:

     <show full YAML>

     This is the single source of truth for your project — all agents read this file.
     CLAUDE.md and AGENTS.md just point here.

     Please fill in:

     **vision** (drives /ideate and /autopilot):
     - purpose — what problem does this project solve?
     - target_users — who uses this?
     - valuable_means — what makes changes valuable?
     - direction — where is this project heading?

     **architecture**:
     - overview — high-level description of how the project is structured
     - structure — key directories and what lives there

     Also review:
     - **conventions** — add project-specific conventions
     - **verify_commands** — adjust if needed
     - **quality_bar** — default is 9/10, adjust if needed
     - **rules** — add project-specific rules

     gotchas and learnings start empty — they accumulate as you work.

     Want to provide details and/or change anything?
     ```

  8. Incorporate user feedback. Write the finalized file to
     `$REPO_ROOT/spec/project.yaml`.

  9. Log: `[bootstrap] Created spec/project.yaml from <template> template`

verify:
  - spec/project.yaml exists with version 1 schema
  - File has all required fields: verify_commands, quality_bar, context.tech_stack,
    rules, signoff_policy, schemas, storage, state_contract
  - User reviewed and approved the content

outputs:
  - spec/project.yaml
