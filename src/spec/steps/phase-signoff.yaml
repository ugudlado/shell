id: phase-signoff
version: 3

intent: Collect explicit user approval at phase end.

inputs:
  - phase_review_report
  - project_signoff_policy

rules:
  - Enforce explicit signoff — this step only runs when signoff is needed (schema-gated).
  - Do not advance on rejected signoff.
  - If schema defines `run-phase-review` for this phase, it MUST have completed before signoff. Block if missing.

instruction: |
  1. Present a summary of the phase: what was done, review score,
     key artifacts or changes produced.
  2. Ask the user for explicit approval.
  3. If approved: record approval in state.yaml, proceed.
  4. If rejected: feed rejection feedback back into current phase
     as fix tasks. Do NOT advance to next phase.
  5. Update state.yaml step_history per CONVENTIONS.md § State Updates.

verify:
  - If schema has run-phase-review for this phase: step_history contains {step_id: run-phase-review, status: completed}
  - User approval or rejection recorded in state.yaml

outputs:
  - phase_signoff_state
