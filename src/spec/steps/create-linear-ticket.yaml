id: create-linear-ticket
version: 1

intent: Create a Linear issue for tracking this change.

inputs:
  - phase_context_bundle
  - updated_artifact_set

rules:
  - Follow Linear config from ~/.config/linear/config.yaml for team and label settings.
  - Attach spec summary as issue description.
  - Store ticket ID in .spec.yaml for downstream reference.

instruction: |
  1. Read ~/.config/linear/config.yaml for team ID and label IDs.
  2. Look up the current repo in config repos: map to get product label.
  3. Create a Linear issue with:
     - Title: from change description
     - Description: summary from spec.md or diagnosis.md
     - Labels: product label + type (Feature/Bug) + complexity estimate
     - Assignee: from config or current user
  4. Store the ticket ID in $SPEC_CHANGES_DIR/$CHANGE_ID/.spec.yaml:
     ```yaml
     linear-ticket: HL-XXX
     ```
  5. Update state.yaml per State Field Registry (CONVENTIONS.md):
     - Set `linear_ticket_id: HL-XXX`
     - Update step_history per § State Updates.

  This step is typically conditional: `create-linear-ticket if linear`
  It runs only when the linear flag is truthy (default true, disabled by --no-linear).

verify:
  - Linear ticket ID recorded in .spec.yaml (or step was skipped)

outputs:
  - linear_ticket_id
