name: bugfix
version: 3

description: >
  Structured bugfix workflow. Enforces reproduce-first diagnosis, root-cause
  investigation before fix, minimal targeted changes, and post-fix verification.
  Methodology proven by SWE-bench evaluation (2x gold-match rate vs unstructured).
  Two signoff gates: diagnosis approval and final signoff. --auto skips both.

uses:
  project: $REPO_ROOT/spec/project.yaml
  steps: $SPEC_HOME/steps/
  templates: $SPEC_HOME/templates/bugfix/

defaults:
  auto: false
  agents: false
  linear: true

flags:
  --no-linear:
    sets: { linear: false }
  --auto:
    sets: { auto: true }
  --agents:
    sets: { agents: true }

rules:
  # Methodology rules — each proven by SWE-bench eval results
  - id: reproduce-first
    rule: >
      Always reproduce the bug with a runnable script/command BEFORE investigating
      code. Grounds diagnosis in actual behavior, not assumptions.
  - id: root-cause-before-fix
    rule: >
      Identify the EXACT line(s) where behavior diverges from expected by reading
      the code path. Do not guess — trace the execution. Fix the root cause, not symptoms.
  - id: minimal-fix
    rule: >
      Make the smallest change that fixes the root cause. Prefer changing 1 line over 5.
      Use existing patterns in the codebase over introducing new ones. Do not refactor
      surrounding code, add unnecessary error handling, or add comments to unchanged code.
  - id: verify-fix
    rule: >
      After implementing the fix, re-run the reproduction script to confirm it works.
      Then check for edge cases and whether the change could break other callers.
  - id: regression-test
    rule: Write a regression test that proves the bug BEFORE implementing the fix.
  - id: zero-regressions
    rule: No existing tests may break. Zero regressions tolerated.

phases:
  - name: diagnose
    goal: Reproduce the bug, confirm root cause with evidence, plan minimal fix.
    outputs:
      - file: diagnosis.md
        template: diagnosis.md
      - file: fix-plan.md
        template: fix-plan.md
        requires: [diagnosis.md]
    rules:
      - Reproduction must be runnable (command or script), not just prose.
      - Root cause must cite exact file, line, and divergence explanation.
      - Fix plan describes the minimal change, not a redesign.
      - Regression test task must appear BEFORE fix task in tasks.md.
    verify:
      assertions:
        - diagnosis.md exists with runnable reproduction steps
        - diagnosis.md has confirmed root cause with file path and line number
        - fix-plan.md exists with approach, affected files, and risk assessment
        - tasks.md exists with regression test task BEFORE fix task
      metrics:
        review_score: { min: 9 }
      max_retries: 3
    steps:
      - create-worktree
      - load-project-context
      - id: diagnose
        extra_rules:
          - "Step 1: Write and run a reproduction script. Step 2: Trace the code path to find exact root cause. Step 3: Assess impact on other callers. Do NOT propose implementation details yet."
      - create-or-refresh-artifacts
      - id: generate-or-refresh-tasks
        extra_rules:
          - First task must be regression test. Second task must be the fix. Order matters.
      - run-phase-review
      - create-linear-ticket if linear
      - phase-signoff if not auto

  - name: implement
    goal: Deliver minimal fix with regression test and verification.
    requires: diagnose
    rules:
      - Work task-by-task with minimal scoped changes.
      - After implementing the fix, re-run the reproduction from diagnosis.md to verify it works.
      - Check that the fix does not break other callers of the modified code.
      - Route failures into retry loops inside the same phase.
      - Do not advance with unresolved critical findings.
    verify:
      commands: $project.verify_commands
      assertions:
        - All tasks in tasks.md marked [x]
        - Regression test exists and passes
        - Regression test FAILS when fix is reverted
        - Reproduction from diagnosis.md now produces expected output
        - Zero other tests broken
      metrics:
        review_score: { min: 9 }
      max_retries: 3
      on_max_retries: escalate to user with remaining gaps listed
    steps:
      - id: execute-next-task
        repeat_until: all_tasks_completed
        extra_rules:
          - "After each fix task: re-run the reproduction script from diagnosis.md. If it still fails, the fix is wrong — investigate further before marking complete."
      - run-simplify
      - run-phase-review
      - final-signoff if not auto

  - name: complete
    goal: Verify fix and archive.
    requires: implement
    rules:
      - Verify all acceptance criteria with evidence.
      - Archive only from canonical active state.
    verify:
      commands: $project.verify_commands
      assertions:
        - All acceptance criteria from fix-plan.md verified with evidence
        - Regression test passes in final test run
        - No critical findings from final review unresolved
      metrics:
        review_score: { min: 9 }
    steps:
      - run-feature-verification
      - compute-prediction-accuracy
      - run-learn-cycle
      - archive-completed-change
      - remove-worktree
