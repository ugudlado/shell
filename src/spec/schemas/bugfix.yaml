name: bugfix
version: 1

description: >
  Structured bugfix workflow. Enforces root-cause investigation before fix.
  Requires regression test to prove bug and prevent recurrence.

uses:
  project: $REPO_ROOT/spec/project.yaml
  steps: $SPEC_HOME/steps/
  templates: $SPEC_HOME/templates/bugfix/

defaults:
  linear: true

flags:
  --no-linear:
    sets: { linear: false }

rules:
  - id: root-cause-only
    rule: Fix the root cause, not symptoms. Keep fixes minimal.
  - id: regression-test
    rule: Write a regression test that proves the bug BEFORE implementing the fix.
  - id: zero-regressions
    rule: No existing tests may break. Zero regressions tolerated.

phases:
  - name: diagnose
    goal: Confirm root cause and minimal fix strategy before implementation.
    outputs:
      - file: diagnosis.md
        template: diagnosis.md
      - file: fix-plan.md
        template: fix-plan.md
        requires: [diagnosis.md]
    rules:
      - Capture reproducible symptom and impact.
      - Validate root cause evidence.
      - Design fix for cause, not symptoms.
      - Include regression-proof verification criteria.
    verify:
      assertions:
        - diagnosis.md exists with confirmed root cause and reproduction steps
        - fix-plan.md exists with approach, affected files, and risk assessment
        - tasks.md exists with regression test task BEFORE fix task
        - Root cause is evidenced (stack trace, log, or reproduction command)
      metrics:
        review_score: { min: 9 }
      max_retries: 3
    steps:
      - load-project-context
      - id: explore-or-diagnose
        extra_rules:
          - Include reproducible bug evidence and confirmed root cause.
      - create-or-refresh-artifacts
      - id: generate-or-refresh-tasks
        extra_rules:
          - Require regression test task before fix task.
      - run-phase-review
      - create-linear-ticket if linear
      - phase-signoff

  - name: implement
    goal: Deliver fix with regression test and verification.
    requires: diagnose
    rules:
      - Work task-by-task with minimal scoped changes.
      - Route failures into retry loops inside the same phase.
      - Do not advance with unresolved critical findings.
    verify:
      commands:
        - type-check
        - test
        - build
      assertions:
        - All tasks in tasks.md marked [x]
        - Regression test exists and passes
        - Regression test FAILS when fix is reverted (confirms it catches the bug)
        - Zero other tests broken (no regressions introduced)
      metrics:
        review_score: { min: 9 }
      max_retries: 3
      on_max_retries: escalate to user with remaining gaps listed
    steps:
      - id: execute-next-task
        repeat_until: all_tasks_completed
        extra_rules:
          - Fix root cause, not only symptoms.
      - run-phase-review
      - phase-signoff

  - name: complete
    goal: Verify fix, obtain approval, and archive.
    requires: implement
    rules:
      - Verify all acceptance criteria with evidence.
      - Require explicit final approval before archive.
      - Archive only from canonical active state.
    verify:
      commands:
        - type-check
        - test
        - build
      assertions:
        - All acceptance criteria from fix-plan.md verified with evidence
        - Regression test passes in final test run
        - No critical findings from final review unresolved
        - Final user approval recorded in state.yaml
      metrics:
        review_score: { min: 9 }
    steps:
      - run-feature-verification
      - final-signoff
      - archive-completed-change
