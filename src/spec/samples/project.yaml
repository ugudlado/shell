# project.yaml — Annotated reference sample for the Spec project config grammar.
# This file demonstrates every field defined in grammar.yaml § PROJECT CONFIG.
# It lives at $REPO_ROOT/spec/project.yaml and is loaded by every schema at
# runtime via `uses.project`. All data is fictional.

# ─── REQUIRED FIELDS ───────────────────────────────────────────────────────────

# Integer version. Increment when the schema of this file changes.
version: 1

# Project identity block — required.
project:
  name: beacon                       # Short identifier, used in state directory paths
  repo: beacon-api                   # Git repository name (from `basename $(git rev-parse --show-toplevel)`)
  summary: >
    REST API gateway for a real-time alert delivery platform. Manages subscriptions,
    routing rules, and delivery confirmations across multiple notification channels.

# ─── OPTIONAL FIELDS ───────────────────────────────────────────────────────────

# ─── CONTEXT ─────────────────────────────────────────────────────────────────
# Descriptive metadata about the project's tech stack and conventions.
# Not enforced mechanically — used by agents to calibrate suggestions and
# pick appropriate patterns when generating code or tasks.

context:
  tech_stack:
    - typescript               # Primary implementation language
    - node                     # Runtime
    - fastify                  # HTTP framework
    - prisma                   # ORM + migrations
    - postgresql               # Database
    - redis                    # Pub/sub and rate-limit backing store
    - vitest                   # Test runner
    - docker                   # Local environment

  conventions:
    - Prefer functional patterns; avoid class inheritance.
    - All public API routes must have OpenAPI annotations.
    - Use zod for runtime validation on every request boundary.
    - Migrations are irreversible — always pair a migration with a rollback plan.
    - Feature flags gate all user-visible changes before full rollout.

# ─── QUALITY BAR ─────────────────────────────────────────────────────────────
# Numeric thresholds applied at every phase review. Schemas reference these
# values in their verify blocks (often via the review_score metric).

quality_bar:
  min_phase_review_score: 9     # Phase review must score >= 9/10 to advance
  max_retry_rounds: 3           # Max fix attempts per phase before escalation

# ─── STORAGE ─────────────────────────────────────────────────────────────────
# Paths for active change artifacts and completed archives.
# Variables: $SPEC_CHANGES_DIR is set by the orchestrator from linear config
# or the default ~/.config/spec/changes/<repo>/.

storage:
  active_changes_root: $SPEC_CHANGES_DIR         # Where in-progress change dirs live
  repo_archive_root: spec/changes/archive        # Committed archive (relative to $REPO_ROOT)
  archive_on:                                    # Conditions that trigger archival
    - merged_to_main                             # /complete-feature merges then archives
    - user_signoff_approved                      # Explicit approval step recorded in state

# ─── STATE CONTRACT ──────────────────────────────────────────────────────────
# Defines where state.yaml lives and how flag precedence is resolved when
# multiple sources supply the same flag.

state_contract:
  file: $SPEC_CHANGES_DIR/$CHANGE_ID/state.yaml  # Canonical state location at runtime

  # required — fields that MUST be present in state.yaml or the orchestrator aborts
  required:
    - schema                   # Which schema is running
    - flags                    # Resolved flag map

  # merge_precedence — when the same flag appears in multiple sources,
  # earlier entries win. Listed from highest to lowest priority.
  merge_precedence:
    - cli_flags                # Flags passed on the command line (--no-tdd, --ff, …)
    - state_flags              # Flags written into state.yaml during a previous session
    - schema_defaults          # The `defaults:` block in the active schema

# ─── SCHEMAS ─────────────────────────────────────────────────────────────────
# Names of workflow schemas available for this project. The orchestrator checks
# that the requested schema is in this list before loading it.

schemas:
  - feature                    # Full TDD feature development
  - bugfix                     # Root-cause investigation then fix
  - chore                      # Config / dependency / rename changes
  - spike                      # Throwaway exploration; no Linear ticket by default
  - migration                  # Database schema changes with rollback planning

# ─── SIGNOFF POLICY ──────────────────────────────────────────────────────────
# Maps phase names to whether user approval is required ("required") or
# optional ("optional") at that phase's boundary.
# "required" means the phase-signoff step blocks until explicit approval.
# "optional" means the step may auto-approve if auto_approve_phases is true.

signoff_policy:
  specify: required             # Spec review is always a human gate
  implement: required           # All tasks must be human-approved before archival
  complete: required            # Final approval always required
  explore: optional             # Spike exploration phases can auto-approve
  prototype: optional           # Fast prototype loops can auto-approve
  diagnose: required            # Bug root-cause findings need human eyes

# ─── RULES ───────────────────────────────────────────────────────────────────
# Project-level rules cascade to ALL schemas and ALL phases unless overridden.
# Two forms: plain string (anonymous) and identified object (with optional `when`).
#
# Rule cascade order (highest → lowest):
#   cli_flags  >  step  >  phase  >  schema  >  project
# Lower-level rules can reference a project rule by `id` to shadow it.

rules:
  # Simple form — always active, no identifier
  - All bearer tokens must be rotated before any artifact is committed.

  # Identified form — always active, overridable by ID at schema/phase/step level
  - id: evidence-based
    rule: Never claim completion without running verification. Show output.

  # Identified form with `when` — only active when the named flag is truthy
  - id: tdd-required
    rule: Write a failing test before implementing each task.
    when: tdd_required

  - id: minimal-diffs
    rule: Keep changes scoped to the current task. No "while I'm here" cleanups.

  - id: spec-first
    rule: Spec artifacts must exist before implementation begins.

  # Rule guarded by flag falsy — `when` with "not <flag>" syntax
  - id: allow-direct-push
    rule: Direct push to main is permitted without PR review.
    when: not require_pr             # Only active when require_pr is false

  - id: state-sync
    rule: Update state.yaml after every step completion. Enables pause/resume.

  - id: retry-limit
    rule: >
      Maximum 3 retry attempts per step. After that, pause and report all
      remaining gaps with evidence before asking the user for direction.
