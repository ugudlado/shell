# step.yaml — Annotated reference sample for the Spec step contract grammar.
# This file demonstrates every field defined in grammar.yaml § STEP CONTRACT
# and § VERIFY GRAMMAR. All data is fictional.
#
# Step contracts live in $SPEC_HOME/steps/<id>.yaml and are referenced by
# schema phases as step entries. A step is self-contained: it declares what
# it reads, what rules govern it, what the agent should do, how to verify
# success, and what it produces.

# ─── REQUIRED FIELDS ───────────────────────────────────────────────────────────

# Unique step identifier. Must match the filename (without .yaml) and match
# references in schema phase step lists.
id: validate-api-contract

# Integer version. Increment when the instruction or verify logic changes
# incompatibly (so /learn can detect drift between schema references and step files).
version: 1

# One-line purpose — answers "what does this step accomplish?"
# Kept short so orchestrators can display it in status lines.
intent: Validate the external API contract against the project's type definitions.

# ─── OPTIONAL FIELDS ───────────────────────────────────────────────────────────

# ─── INPUTS ──────────────────────────────────────────────────────────────────
# Symbolic names of artifacts or context bundles this step reads.
# These are resolved by the orchestrator from state.yaml and the change directory.
# Convention: snake_case names; well-known names include phase_context_bundle,
# tasks.md, spec.md, discovery_result.

inputs:
  - phase_context_bundle       # Standard bundle: project.yaml, state.yaml, spec.md, tasks.md
  - api-schema.yaml            # Specific artifact from the change directory
  - src/types/api.ts           # Repo file path (relative to $REPO_ROOT)

# ─── RULES ───────────────────────────────────────────────────────────────────
# Step-level rules. Always applied when this step executes, regardless of which
# schema or phase invoked it. Use for invariants that must hold at every callsite.

rules:
  - Never modify source files during validation — read only.
  - Report all type mismatches, not just the first one found.
  - If the API schema file is missing, stop immediately and report the gap.

# ─── INSTRUCTION ─────────────────────────────────────────────────────────────
# Multi-line execution logic. The agent follows this as a numbered procedure.
# Written in imperative prose. Variables like $REPO_ROOT, $CHANGE_ID, and flag
# values are available at runtime. The `|` block scalar preserves line breaks.

instruction: |
  1. Load api-schema.yaml from the change directory ($SPEC_CHANGES_DIR/$CHANGE_ID/).
     If the file does not exist, stop and record a blocker in state.yaml with
     the message "api-schema.yaml missing — run the design-exploration step first."

  2. Load the TypeScript API type definitions from src/types/api.ts.

  3. For each endpoint declared in api-schema.yaml, verify:
     a. A matching TypeScript interface exists in api.ts.
     b. All required fields are present in the interface.
     c. Field types are compatible (string↔string, number↔number, etc.).
     d. Optional fields are typed as `T | undefined` or `T | null`.

  4. For any mismatch found:
     - Record the endpoint name, field name, schema type, and TS type.
     - Tag each mismatch as: missing_field | type_mismatch | extra_field.

  5. If zero mismatches: mark step as passing and write results to state.yaml
     under verification_results.validate_api_contract.

  6. If any mismatches: write the full list to state.yaml and fail this step.
     Do NOT attempt auto-fixes — fixes belong in a separate implementation task.

  7. Update state.yaml: set step_id to "validate-api-contract", updated_at to now.

# ─── VERIFY ──────────────────────────────────────────────────────────────────
# Post-execution checks. Two forms are valid (grammar.yaml § VERIFY):
#
#   List form:     verify:
#                    - Plain-English assertion the agent evaluates
#                    - Another assertion
#
#   Block form:    verify:
#                    commands: [...]
#                    assertions: [...]
#                    metrics: { ... }
#                    after_each: [...]        # for repeat_until steps
#                    repeat_done_when: [...]  # for repeat_until steps
#                    max_retries: N
#                    on_max_retries: <action>
#
# This step uses the BLOCK FORM to show all sub-fields.

verify:
  # commands — shell commands that must exit 0. Run by the orchestrator, not
  # the agent. Keep these fast; save slow commands for phase-level verify.
  commands:
    - jq . $SPEC_CHANGES_DIR/$CHANGE_ID/api-schema.yaml  # Confirm schema is valid JSON/YAML

  # assertions — plain-English checks the agent evaluates against artifacts,
  # state.yaml, or command output. Written as declarative facts that must be true.
  assertions:
    - api-schema.yaml was successfully parsed (no syntax errors)
    - verification_results.validate_api_contract exists in state.yaml
    - Every mismatch has endpoint, field, schema_type, and ts_type recorded
    - state.yaml step_id equals "validate-api-contract"

  # metrics — numeric thresholds. Agent measures the named value and compares.
  # `when` makes a metric conditional on a flag being truthy.
  metrics:
    mismatch_count:
      min: 0                   # Must be >= 0 (sanity check)
      max: 0                   # For a passing step: zero mismatches allowed
    endpoint_coverage:
      min: 100                 # All endpoints must be checked
      when: strict_mode        # Only enforced when the strict_mode flag is truthy

  # max_retries — maximum fix iterations before this step escalates.
  # Applies when the verify block fails and the agent attempts corrections.
  max_retries: 2

  # on_max_retries — what to do when max_retries is exhausted.
  # Omit to use the default ("escalate").
  on_max_retries: pause and list all unresolved mismatches for user triage

  # after_each — for steps used with `repeat_until` in a schema phase.
  # Checked after every iteration of the repeating step. Not relevant here
  # (this step does not repeat), but shown for completeness.
  # after_each:
  #   - The current batch of mismatches has been recorded in state.yaml

  # repeat_done_when — for repeating steps: conditions that end the loop.
  # Not used here; shown as a comment for contrast with execute-next-task style.
  # repeat_done_when:
  #   - No unchecked endpoints remain in api-schema.yaml

# ─── OUTPUTS ─────────────────────────────────────────────────────────────────
# Symbolic names of what this step produces. Consumed as inputs by later steps.
# Matches the keys written to state.yaml or the change directory.

outputs:
  - validation_result           # Written to state.yaml verification_results map
