version: 1

commands:
  explore:
    goal: Clarify intent and constraints without implementation.
    outputs:
      - clarified_problem_statement
      - assumptions_and_risks
  new:
    goal: Create a new change and initial artifacts.
    requires:
      - change_description
    optional_flags:
      - --no-tdd
      - --ff
    outputs:
      - change_id
      - initial_artifacts
  continue:
    goal: Resume an active change from persisted state.
    requires:
      - existing_change_id
    outputs:
      - active_cursor
      - next_action_hint
  ff:
    goal: Fill forward required artifacts for a change.
    requires:
      - change_id
    outputs:
      - apply_ready_artifacts
  apply:
    goal: Execute implementation tasks against current artifacts.
    requires:
      - apply_ready_artifacts
    outputs:
      - task_progress
      - code_changes
  verify:
    goal: Validate task completion and acceptance criteria.
    requires:
      - implemented_changes
    outputs:
      - verification_report
      - pass_or_fail
  archive:
    goal: Archive completed change artifacts.
    requires:
      - completion_or_override_confirmation
    outputs:
      - archive_path
      - archive_summary
