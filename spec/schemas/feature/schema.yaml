name: feature
version: 1
description: >
  Canonical feature development schema. Use --no-tdd to disable test-first
  enforcement and --ff to run fill-forward artifact preparation.

artifacts:
  - id: discovery
    generates: discovery.md
    description: Discovery brief — use cases, scope, personas, UI direction
    template: discovery.md
    requires: []

  - id: spec
    generates: spec.md
    description: Full specification — motivation, requirements, architecture, alternatives
    template: spec.md
    requires:
      - discovery

  - id: design
    generates: design.md
    description: Technical design — components, data flow, error handling
    template: design.md
    requires:
      - spec

  - id: tasks
    generates: tasks.md
    description: Phased task list with dependencies and verification criteria
    template: tasks.md
    requires:
      - spec
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Work through tasks in phase order. Mark [→] when starting and [x] when done.
    Respect dependency annotations and parallel markers.

    FEATURE FLAGS:
    - --no-tdd: tests are optional unless required by task verification criteria.
    - --ff: run fill-forward before apply to ensure artifacts are complete.

    DEFAULT FEATURE MODE (without --no-tdd):
    - Use test-first sequencing where practical.
    - Keep strong verification at phase gates.

    PHASE GATES:
    - With TDD enabled: type-check + test (+ coverage where configured) + build.
    - With --no-tdd: type-check + build (run tests when present or required).
    - Run review gate with project quality threshold.
    - Keep verification bugs in current phase; do not skip ahead with known issues.

workflow: workflow.yaml
