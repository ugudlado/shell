id: resolve-change
version: 1

intent: Determine change ID, schema, and whether to create or resume.

inputs:
  - user_request
  - command
  - flags

rules:
  - Prefer existing active change when request clearly targets it.
  - If ambiguous, keep current change untouched and request clarification.
  - Resolve schema to canonical catalog values (feature or bugfix).
  - For feature, honor --no-tdd and --ff flags.
  - Merge flags from CLI and state.flags, then persist merged flags.

instruction: |
  1. Determine the action: new, continue, or apply.
  2. For new: derive a slug/change ID from user intent.
     For continue or apply: match active changes in $SPEC_CHANGES_DIR/.
  3. Resolve schema to canonical value (feature or bugfix).
     Auto-detect from description keywords if no flag provided:
     - "fix", "bug", "broken", "regression", "crash" → bugfix
     - Otherwise → feature
  4. Parse feature flags (--no-tdd, --ff) and merge with existing state.flags.
     Precedence: CLI flags > state flags > feature_defaults.
  5. Write merged flags back to state.yaml before continuing.
  6. Resolve workflow path: spec/schemas/$SCHEMA/workflow.yaml.
  7. Update state.yaml with schema, flags, and resolved context.

checks:
  - change_target_is_unique
  - schema_is_known

outputs:
  - resolved_change_context
  - resolved_feature_flags
  - resolved_workflow_path
